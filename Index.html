<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUSTODIO SUPLICO FIREWORKS</title>

  <style>
    :root{
      --bg:#080808;
      --panel:#121212;
      --panel2:#181818;
      --line:#2a2a2a;
      --text:#f7f7f7;
      --muted:#999;
      --gold:#d7ad55;
      --gold2:#f2cf7b;
      --danger:#e66d6d;
      --success:#78d499;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    button,input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{display:none!important}

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 20% 20%,rgba(215,173,85,.12),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(215,173,85,.06),transparent 30%),
        #080808;
    }

    .card{
      width:min(460px,100%);
      padding:32px;
      border-radius:24px;
      border:1px solid #292929;
      background:rgba(18,18,18,.92);
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      backdrop-filter:blur(16px);
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand-mark{
      width:72px;
      height:72px;
      margin:0 auto 16px;
      display:grid;
      place-items:center;
      border-radius:20px;
      background:#0e0e0e;
      border:1px solid #303030;
      color:var(--gold2);
      font-weight:900;
      letter-spacing:.08em;
    }

    h1{
      margin:0;
      font-size:25px;
      letter-spacing:.04em;
    }

    .subtitle{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
    }

    .field{
      margin-bottom:16px;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      color:#cfcfcf;
      font-size:12px;
    }

    .field input{
      width:100%;
      padding:13px 14px;
      color:#fff;
      background:#0d0d0d;
      border:1px solid #303030;
      border-radius:12px;
      outline:none;
      transition:.18s ease;
    }

    .field input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(215,173,85,.08);
    }

    .password-wrap{
      display:flex;
      gap:8px;
    }

    .password-wrap input{
      min-width:0;
      flex:1;
    }

    .btn{
      border:1px solid #343434;
      background:#1a1a1a;
      color:#fff;
      padding:11px 14px;
      border-radius:12px;
      transition:.18s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:#555;
      background:#222;
      box-shadow:0 8px 24px rgba(0,0,0,.24);
    }

    .btn:active{
      transform:translateY(0);
    }

    .btn:disabled{
      opacity:.7;
      cursor:not-allowed;
      transform:none;
    }

    .btn.gold{
      width:100%;
      margin-top:8px;
      border:0;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#111;
      font-weight:800;
    }

    .btn.danger{
      border-color:#6d3838;
      background:#1a0f0f;
      color:#ff9e9e;
    }

    .btn.danger:hover{
      border-color:#8a4747;
      background:#231212;
    }

    .btn.loading{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:9px;
    }

    .spinner{
      width:15px;
      height:15px;
      border:2px solid rgba(17,17,17,.25);
      border-top-color:#111;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .remember{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:12px;
    }

    .status{
      min-height:20px;
      margin:8px 0;
      font-size:13px;
    }

    .status.error{color:#ff9898}
    .status.success{color:var(--success)}

    .dashboard{
      min-height:100vh;
      padding:28px;
      background:
        radial-gradient(circle at top right,rgba(215,173,85,.08),transparent 28%),
        #080808;
    }

    .dashboard-inner{
      max-width:1100px;
      margin:0 auto;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:22px;
    }

    .eyebrow{
      color:var(--gold2);
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .welcome{
      margin-top:6px;
      font-size:26px;
      font-weight:800;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
    }

    .status-card{
      padding:14px 16px;
      border:1px solid #2d2d2d;
      border-radius:14px;
      background:#111;
      color:#bfbfbf;
      font-size:12px;
    }

    .dot{
      display:inline-block;
      width:8px;
      height:8px;
      margin-right:7px;
      border-radius:50%;
      background:var(--success);
    }

    .test-card{
      margin-top:16px;
      padding:18px;
      border:1px solid #2b2b2b;
      border-radius:16px;
      background:#111;
    }

    @media(max-width:700px){
      .top{
        flex-direction:column;
      }

      .dashboard{
        padding:16px;
      }
    }
  
    .app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr;background:#080808}
    .sidebar{position:sticky;top:0;height:100vh;padding:16px;background:linear-gradient(180deg,#0b0b0b,#111);border-right:1px solid #272727;display:flex;flex-direction:column}
    .side-brand{display:flex;align-items:center;gap:10px;padding:8px 6px 18px;border-bottom:1px solid #292929}
    .brand-mark.small{width:42px;height:42px;margin:0;border-radius:12px;font-size:12px}
    .side-title{font-size:11px;font-weight:800;letter-spacing:.08em}
    .side-subtitle{font-size:10px;color:#666;margin-top:2px}
    .side-nav{flex:1;padding:14px 0;overflow:auto}
    .nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:3px;border:0;border-radius:11px;background:transparent;color:#aaa;text-align:left;transition:.18s ease}
    .nav-btn:hover{background:#1b1b1b;color:#fff}
    .nav-btn.active{background:#1a1a1a;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
    .nav-icon{width:18px;text-align:center;color:#888}
    .nav-btn.active .nav-icon{color:var(--gold2)}
    .logout-nav{margin-top:10px}
    .main-shell{min-width:0}
    .topbar{height:70px;padding:12px 22px;border-bottom:1px solid #282828;background:rgba(9,9,9,.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between}
    .breadcrumb{font-size:11px;color:#777}
    .page-title{font-size:20px;font-weight:800;margin-top:2px}
    .profile-chip{display:flex;align-items:center;gap:9px}
    .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#aa8029,#edd07a);color:#111;font-weight:900}
    .profile-name{font-size:12px;color:#aaa}
    .module-content{padding:22px;max-width:1800px;margin:0 auto}
    .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
    .section-title{font-size:18px;font-weight:800}
    .section-subtitle{font-size:12px;color:#777;margin-top:4px}
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
    .metric-card{padding:16px;border:1px solid #2a2a2a;border-radius:16px;background:linear-gradient(180deg,#151515,#101010)}
    .metric-label{font-size:11px;color:#858585}
    .metric-value{font-size:23px;font-weight:800;margin-top:7px}
    .dashboard-columns{display:grid;grid-template-columns:1.35fr .95fr;gap:16px;margin-bottom:16px}
    .panel{padding:18px;border:1px solid #2a2a2a;border-radius:17px;background:linear-gradient(180deg,#131313,#101010);margin-bottom:16px}
    .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
    .panel-title{font-weight:800}
    .panel-subtitle{font-size:11px;color:#777;margin-top:3px}
    .btn.small{padding:8px 11px;font-size:12px}
    .table-wrap{overflow:auto;border:1px solid #242424;border-radius:12px}
    .data-table{width:100%;border-collapse:collapse;min-width:560px}
    .data-table th,.data-table td{padding:10px 11px;border-bottom:1px solid #222;text-align:left;font-size:12px;white-space:nowrap}
    .data-table th{color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:#111}
    .data-table tr:hover td{background:#151515}
    .badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(215,173,85,.11);color:var(--gold2);font-size:10px}
    .empty-state{padding:34px;text-align:center;color:#777}.empty-state-title{font-weight:800;color:#ddd;margin-bottom:6px}.empty-state-sub{font-size:11px;color:#777}.table-actions{display:flex;gap:6px;align-items:center}.full-width{grid-column:1/-1}
    .loading-card,.error-card{padding:30px;border:1px solid #2b2b2b;border-radius:16px;background:#111;color:#aaa}
    .error-card{color:#ff9b9b;border-color:#6d3838}
    .activity-list{display:grid;gap:0}
    .activity-row{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #202020}
    .activity-row:last-child{border-bottom:0}
    .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:5px;flex:0 0 auto}
    .activity-main{min-width:0;flex:1}
    .activity-title{font-size:12px;font-weight:700}
    .activity-sub{font-size:11px;color:#777;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .activity-time{font-size:10px;color:#666;white-space:nowrap}

    @media(max-width:1000px){
      .metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .dashboard-columns{grid-template-columns:1fr}
    }
    @media(max-width:800px){
      .app-shell{grid-template-columns:1fr}
      .sidebar{position:fixed;left:-270px;z-index:100;width:250px;transition:.2s}
      .profile-name{display:none}
      .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .module-content{padding:14px}
    }
    @media(max-width:520px){
      .metric-grid{grid-template-columns:1fr}
      .topbar{padding:10px 14px}
    }

  
    .action-row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid #242424}.tab{border:0;background:transparent;color:#777;padding:10px 13px;border-bottom:2px solid transparent;cursor:pointer}.tab:hover{color:#fff}.tab.active{color:var(--gold2);border-color:var(--gold)}
    .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:#8b8b8b}.form-grid input,.form-grid select,.form-grid textarea,#globalDialog input,#globalDialog select,#globalDialog textarea{width:100%;box-sizing:border-box;background:#0c0c0c;border:1px solid #2a2a2a;color:#eee;border-radius:10px;padding:10px 11px;outline:none}
    textarea{min-height:80px;resize:vertical}.form-grid input:focus,.form-grid select:focus,#globalDialog input:focus,#globalDialog select:focus,#globalDialog textarea:focus{border-color:#80632b;box-shadow:0 0 0 3px rgba(214,173,85,.07)}
    .dialog-actions{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:16px}.inner-panel{margin:12px 0}.package-item{display:grid;grid-template-columns:1.7fr .6fr .8fr auto;gap:8px;margin-bottom:8px}.table-action{border:0;background:transparent;color:var(--gold2);cursor:pointer;padding:4px 6px}.danger-text{color:#ef8585}.danger-badge{background:rgba(200,70,70,.12);color:#ff9b9b}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:500;backdrop-filter:blur(8px)}.modal.show{display:flex}.dialog-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #303030;border-radius:18px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.dialog-card.wide{width:min(980px,100%)}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px}.dialog-title{font-size:18px;font-weight:800}.dialog-subtitle{font-size:11px;color:#777;margin-top:4px}.dialog-close{border:0;background:transparent;color:#888;font-size:25px;cursor:pointer}.dialog-close:hover{color:#fff}.dialog-error{padding:10px 12px;background:rgba(180,60,60,.1);border:1px solid #633535;color:#ff9e9e;border-radius:10px;margin-bottom:12px;font-size:12px}
    .toast{position:fixed;right:20px;bottom:20px;z-index:700;padding:12px 15px;background:#161616;border:1px solid #383838;border-radius:12px;color:#eee;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:-2px}.small-spinner{width:11px;height:11px}@keyframes spin{to{transform:rotate(360deg)}}button:disabled{opacity:.55;cursor:not-allowed}
    @media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.package-item{grid-template-columns:1fr 1fr}.dialog-actions{grid-template-columns:1fr}.action-row{width:100%}}


    .source-switch{display:flex;gap:6px;padding:4px;background:#0d0d0d;border:1px solid #272727;border-radius:12px;width:max-content;margin-bottom:14px}
    .source-btn{border:1px solid transparent;background:transparent;color:#777;font-weight:800;font-size:11px;letter-spacing:.08em;padding:10px 16px;border-radius:8px;cursor:pointer;transition:.18s}
    .source-btn:hover{color:#fff;background:#171717}
    .source-btn.active{color:#0d0d0d;background:var(--gold2);box-shadow:0 5px 18px rgba(214,173,85,.14)}


    .client-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .search-box{display:flex;align-items:center;gap:8px;background:#0d0d0d;border:1px solid #282828;border-radius:11px;padding:0 11px;width:min(420px,100%);transition:.18s}
    .search-box:focus-within{border-color:#80632b;box-shadow:0 0 0 3px rgba(214,173,85,.06)}
    .search-box span{color:#777;font-size:18px;flex:0 0 auto}.search-box input{flex:1 1 auto;min-width:0;width:100%;border:0!important;outline:none!important;background:transparent!important;box-shadow:none!important;padding:10px 0!important;color:#eee!important}


    .workspace-dialog{max-width:900px!important}
    .workspace-section{padding:14px 0;border-bottom:1px solid #242424}
    .workspace-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--gold2);margin-bottom:12px}
    .tax-preview{display:flex;justify-content:space-between;gap:16px;margin:14px 0;padding:13px 15px;border:1px solid #292929;border-radius:12px;background:#101010}
    .tax-preview div{display:flex;flex-direction:column;gap:4px}.tax-preview span{font-size:11px;color:#777}.tax-preview strong{font-size:13px;color:#eee}


    .dashboard-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
    .dashboard-metrics .metric-card{min-height:96px}
    .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .analytics-card{background:linear-gradient(180deg,#131313,#0f0f0f);border:1px solid #292929;border-radius:18px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.15)}
    .analytics-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .analytics-stat{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .analytics-stat span{font-size:10px;color:#6f6f6f;text-transform:uppercase;letter-spacing:.08em}
    .analytics-stat strong{font-size:12px;color:var(--gold2)}
    .chart-wrap{position:relative;height:280px;margin-top:12px;overflow:hidden}
    .chart-gridlines{position:absolute;inset:10px 0 34px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
    .gridline{border-top:1px solid #222}
    .bar-chart{position:absolute;inset:10px 0 0 0;display:flex;align-items:flex-end;gap:8px;padding:0 6px 0 6px}
    .bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:20px}
    .bar{width:min(34px,72%);background:linear-gradient(180deg,var(--gold2),#9c7228);border-radius:8px 8px 3px 3px;box-shadow:0 10px 24px rgba(215,173,85,.08);transition:height .25s ease}
    .bar:hover{filter:brightness(1.15);transform:translateY(-2px)}
    .bar-value{font-size:9px;color:#777;min-height:12px}
    .bar-label{font-size:9px;color:#666}
    .chart-footer{display:flex;justify-content:space-between;gap:12px;margin-top:4px;font-size:10px;color:#777}
    .sales-svg{width:100%;height:100%;overflow:visible}
    .svg-grid{stroke:#242424;stroke-width:1}
    .sales-area{fill:rgba(215,173,85,.10)}
    .sales-line{stroke:var(--gold2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .sales-point{fill:#111;stroke:var(--gold2);stroke-width:3;cursor:pointer}
    .sales-point:hover{r:6}
    .svg-label{fill:#666;font-size:9px}
    @media(max-width:950px){.analytics-grid{grid-template-columns:1fr}}


    .loan-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
    .loan-stat{padding:15px;border:1px solid #2a2a2a;border-radius:15px;background:#111;display:flex;flex-direction:column;gap:5px}
    .loan-stat span{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}.loan-stat strong{font-size:20px;color:#eee}
    @media(max-width:700px){.loan-summary{grid-template-columns:1fr}}


    .filter-row,.action-row,.expense-chips,.report-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .section-card-head .btn.gold{width:auto;margin-top:0;flex:0 0 auto;white-space:nowrap}
    .expense-chips.compact{margin:12px 0;gap:6px}
    .expense-chips.compact span{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid #2b2b2b;border-radius:999px;background:#151515;color:#aaa;font-size:10px;line-height:1}
    .expense-chips.compact span:first-child{border-color:#80632b;color:var(--gold2);background:rgba(215,173,85,.08)}
    .expense-table{border:1px solid #242424;border-radius:12px;overflow:auto}
    .filter-btn{border:1px solid #2b2b2b;background:#101010;color:#888;border-radius:9px;padding:8px 11px;font-size:11px}.filter-btn:hover,.filter-btn.active{color:#fff;border-color:#5b4a28;background:#171717}
    .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.mini-stat{padding:15px;border:1px solid #292929;border-radius:14px;background:#111;display:flex;flex-direction:column;gap:6px}.mini-stat span{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.07em}.mini-stat strong{font-size:19px;color:#eee}
    .split-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail-grid>div{padding:12px;border:1px solid #242424;border-radius:11px;background:#0e0e0e}.detail-grid span{display:block;font-size:10px;color:#666}.detail-grid strong{display:block;margin-top:5px;font-size:12px}

<body>

<div id="app"></div>

<script>
  const state = {
    token: localStorage.getItem('csf_phase1_token') || '',
    user: null
  };

  function esc(value){
    return String(value ?? '')
      .replace(/[&<>"']/g, ch => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[ch]));
  }

  function renderLogin(message=''){
    document.getElementById('app').innerHTML = `
      <div class="page">
        <div class="card">
          <div class="brand">
            <div class="brand-mark">CSF</div>
            <h1>CUSTODIO SUPLICO FIREWORKS</h1>
            <div class="subtitle">Business Management & Tracking System</div>
          </div>

          <form id="loginForm">
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                autocomplete="username"
                value="admin@custodiosuplico.com"
                required
              >
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input
                  id="password"
                  type="password"
                  autocomplete="current-password"
                  required
                >
                <button id="togglePassword" type="button" class="btn">Show</button>
              </div>
            </div>

            <div class="row">
              <label class="remember">
                <input id="remember" type="checkbox">
                Remember me
              </label>
            </div>

            <div id="loginStatus" class="status error">${esc(message)}</div>

            <button id="loginButton" type="submit" class="btn gold">
              <span id="loginText">Sign in</span>
              <span id="loginSpinner" class="spinner hidden"></span>
            </button>
          </form>
        </div>
      </div>
    `;

    document.getElementById('togglePassword')
      .addEventListener('click', togglePassword);

    document.getElementById('loginForm')
      .addEventListener('submit', submitLogin);

    testServer();
  }

  function togglePassword(){
    const field = document.getElementById('password');
    const button = document.getElementById('togglePassword');

    if(field.type === 'password'){
      field.type = 'text';
      button.textContent = 'Hide';
    }else{
      field.type = 'password';
      button.textContent = 'Show';
    }
  }

  function setLoginLoading(loading){
    const button = document.getElementById('loginButton');
    const text = document.getElementById('loginText');
    const spinner = document.getElementById('loginSpinner');

    if(!button) return;

    button.disabled = loading;
    button.classList.toggle('loading', loading);

    if(loading){
      text.textContent = 'Signing in...';
      spinner.classList.remove('hidden');
    }else{
      text.textContent = 'Sign in';
      spinner.classList.add('hidden');
    }
  }

  function showLoginError(message){
    const el = document.getElementById('loginStatus');
    if(el) el.textContent = message || '';
  }

  function testServer(){
    google.script.run
      .withSuccessHandler(function(result){
        if(!result || !result.ok){
          showLoginError('Server connection failed.');
        }
      })
      .withFailureHandler(function(error){
        showLoginError(
          'Server connection failed: ' +
          (error && error.message ? error.message : String(error))
        );
      })
      .pingServer();
  }

  function submitLogin(event){
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    showLoginError('');

    if(!email){
      showLoginError('Please enter your email.');
      return;
    }

    if(!password){
      showLoginError('Please enter your password.');
      return;
    }

    setLoginLoading(true);

    google.script.run
      .withSuccessHandler(function(result){
        setLoginLoading(false);

        if(!result || !result.ok){
          showLoginError(
            result && result.message
              ? result.message
              : 'Unable to sign in.'
          );
          return;
        }

        state.token = result.token;
        state.user = result.user;

        localStorage.setItem(
          'csf_phase1_token',
          result.token
        );

        renderDashboard();
      })
      .withFailureHandler(function(error){
        setLoginLoading(false);

        showLoginError(
          'Login failed: ' +
          (error && error.message
            ? error.message
            : String(error))
        );
      })
      .login(email, password, remember);
  }

  function renderBookingBars(rows){

      return `

          <div class="bar-value">${val}</div>
          <div class="bar" style="height:${height}%"></div>

    }).join('');

  function renderSalesChart(rows){
    const values=rows.map(r=>Number(r.sales||0));
    const max=Math.max(1,...values);
    const width=720;
    const height=250;
    const left=28;
    const right=12;
    const top=18;
    const bottom=34;
    const chartW=width-left-right;
    const chartH=height-top-bottom;
    const points=rows.map((r,i)=>{
      const x=left+(i*(chartW/(rows.length-1)));
      const y=top+chartH-(Number(r.sales||0)/max*chartH);
      return {x,y};
    });

    const line=points.map(p=>`${p.x},${p.y}`).join(' ');
    const area=`${left},${top+chartH} ${line} ${left+chartW},${top+chartH}`;

    return `
      <svg viewBox="0 0 ${width} ${height}" class="sales-svg" role="img" aria-label="Monthly sales chart">
        ${[0,1,2,3,4].map(i=>{
          const y=top+(chartH*(i/4));
          return `<line x1="${left}" y1="${y}" x2="${left+chartW}" y2="${y}" class="svg-grid"/>`;
        }).join('')}
        <polygon points="${area}" class="sales-area"></polygon>
        <polyline points="${line}" class="sales-line" fill="none"></polyline>
        ${points.map((p,i)=>`
          <circle cx="${p.x}" cy="${p.y}" r="4" class="sales-point">
            <title>${esc(rows[i].month)}: ${money(rows[i].sales||0)}</title>
          </circle>
          <text x="${p.x}" y="${height-12}" text-anchor="middle" class="svg-label">${esc(rows[i].month)}</text>
        `).join('')}
      </svg>
    `;
  }

  function formatTimeInputValue(value){
    if(!value) return '';
    const s=String(value).trim().replace(/^'/,'').trim();
    let m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?/);
    if(m) return String(Number(m[1])).padStart(2,'0')+':'+m[2];
    m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if(m){let h=Number(m[1]),min=m[2],ap=m[3].toUpperCase();if(ap==='AM'&&h===12)h=0;if(ap==='PM'&&h!==12)h+=12;return String(h).padStart(2,'0')+':'+min;}
    return '';
  }
  function formatTime12(value){
    if(value === null || value === undefined || value === '') return '';

    const s=String(value).trim().replace(/^'/,'').trim();
    if(!s) return '';

    // Already in 12-hour format. Accept optional seconds.
    let m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
    if(m){
      let h=Number(m[1]);
      const min=m[2];
      const ap=m[3].toUpperCase();
      if(h>=1 && h<=12) return h+':'+min+' '+ap;
    }

    // HTML time / legacy 24-hour format.
    m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if(m){
      const h24=Number(m[1]);
      const min=Number(m[2]);
      if(h24>=0 && h24<=23 && min>=0 && min<=59){
        const ap=h24>=12?'PM':'AM';
        const h12=h24%12||12;
        return h12+':'+String(min).padStart(2,'0')+' '+ap;
      }
    }

    // Google Sheets time serial as a fraction of a day.
    if(/^0(?:\.\d+)?$/.test(s) || /^1(?:\.0+)?$/.test(s)){
      const fraction=Number(s);
      if(isFinite(fraction) && fraction>=0 && fraction<1){
        const totalMinutes=Math.round(fraction*24*60)%(24*60);
        const h24=Math.floor(totalMinutes/60);
        const min=totalMinutes%60;
        const ap=h24>=12?'PM':'AM';
        const h12=h24%12||12;
        return h12+':'+String(min).padStart(2,'0')+' '+ap;
      }
    }

    // Legacy Google Sheets Date/ISO value, including 1899-12-30 time serials.
    const d=new Date(s);
    if(!isNaN(d.getTime())){
      const h24=d.getHours();
      const min=d.getMinutes();
      const ap=h24>=12?'PM':'AM';
      const h12=h24%12||12;
      return h12+':'+String(min).padStart(2,'0')+' '+ap;
    }

    return '';
  }

  function openShowWorkspace(bookingId){
    const requestedBookingId=String(bookingId||'').trim();
    if(!requestedBookingId){ toast('Booking/show ID is missing.'); return; }

    activeShowId=requestedBookingId;
    window.currentShowWorkspaceData=null;
    window.currentShowUsageData=null;
    window.currentShowProductData=null;
    window.currentShowMaterialData=null;
    document.getElementById('showWorkspaceEmpty')?.classList.add('hidden');
    document.getElementById('showWorkspace')?.classList.remove('hidden');

    // Render the clicked show immediately from the already-loaded Clients/Shows list.
    // This removes the blank/old workspace feeling while the server loads the full details.
    const cached = (Array.isArray(clientShowRows) ? clientShowRows : []).find(function(row){
      return String(row.ID || row.BookingID || '') === requestedBookingId;
    });
    if(cached){
      const cachedTime = String(cached['Event Time'] || cached.EventTime || cached.Time || '').trim();
      const cachedName = String(cached['Client Name'] || '').trim();
      const cachedStatus = String(cached['Booking Status'] || 'Pending');
      const cachedEvent = String(cached['Event Name'] || cached['Event Type'] || '');
      document.getElementById('showSummary').innerHTML=`
        <div class="show-summary-card">
          <div><div class="eyebrow">CLIENT / SHOW</div><div class="show-title">${esc(cachedName)}</div><div class="show-subtitle">${esc(cachedEvent)} · ${esc(formatDate(cached['Event Date']))}${cachedTime?' · '+esc(formatTime12(cachedTime)):''}</div></div>
          <div class="show-summary-right"><span class="status-badge">${esc(cachedStatus)}</span><div class="show-location">${esc(cached.Location||'')}</div></div>
        </div>`;
      window.currentShowBooking = Object.assign({}, cached);
    }
    const initialBox=document.getElementById('workspaceTabContent');
    if(initialBox) initialBox.innerHTML='<div class="loading-card">Loading show details...</div>';

    google.script.run.withSuccessHandler(function(r){
      // Ignore a slower response from a previously clicked show.
      if(String(activeShowId||'')!==requestedBookingId) return;
      if(!r||!r.ok){toast(r&&r.message||'Unable to load show.');return;}

      const b=r.booking||{};
      const initialEventTime = String(r.eventTime || b['Event Time'] || b.EventTime || b.Time || '').trim();
      // The Booking record is authoritative for which Client/Show was clicked.
      const bookingClientName=String(b['Client Name']||'').trim();
      const displayClientName=bookingClientName || String(r.client?.Name||'').trim();

      function renderClientShowWithTime(eventTime){
        if(String(activeShowId||'')!==requestedBookingId) return;
        r.eventTime = String(eventTime || '').trim();
        b['Event Time'] = r.eventTime;
        renderShowSummaryCard(b, displayClientName);
      }

      // Render Overview immediately from the workspace response already loaded above.
      // This removes the second server round-trip that was making detail switching slow.
      function renderOverviewFromCurrentWorkspace(eventTime){
        if(String(activeShowId||'')!==requestedBookingId) return;
        renderClientShowWithTime(eventTime);
        window.currentShowBooking = b;
        // Keep the server-calculated workspace totals intact so Overview,
        // Products, Materials, Crew, Expenses, Payments, and Profit all use
        // the same numbers. The server totals already classify Products with
        // Category=Materials correctly as Material Cost.
        const overviewData = Object.assign({}, r, {
          eventTime: String(eventTime || '').trim(),
          booking: b,
          totals: Object.assign({
            productCost:0,
            materialCost:0,
            totalCost:0,
            productSellingTotal:0,
            crewCost:0,
            expenseTotal:0
          }, r.totals || {})
        });
        window.currentShowWorkspaceData = overviewData;
        window.currentShowProductData = overviewData.productData || null;
        window.currentShowMaterialData = overviewData.materialData || null;
        renderWorkspaceTabContent(overviewData,'overview');

        // Products and Materials are already included in the initial workspace payload.
        // Reuse those cached datasets on tab switches instead of requesting them again.
        window.currentShowUsageData = null;
      }

      if(initialEventTime){
        renderOverviewFromCurrentWorkspace(initialEventTime);
      }else{
        // Do not request Event Time separately just to render Overview.
        renderOverviewFromCurrentWorkspace('');
      }
    }).withFailureHandler(function(x){
      if(String(activeShowId||'')!==requestedBookingId) return;
      toast(x&&x.message||'Unable to load show.');
    }).getShowWorkspace(state.token,requestedBookingId,true);
  }

  function showWorkspaceTab(tab,btn){
    document.querySelectorAll('.workspace-nav-btn').forEach(x=>x.classList.remove('active'));
    if(btn)btn.classList.add('active');

    const currentId=String(activeShowId||'');
    const workspace=window.currentShowWorkspaceData;
    const workspaceId=String(workspace?.booking?.ID || workspace?.booking?.BookingID || '');

    if(workspace && workspaceId===currentId && tab!=='products' && tab!=='materials'){
      renderWorkspaceTabContent(workspace,tab);
      return;
    }

    const workspaceTabData = tab==='products' ? workspace?.productData :
                             tab==='materials' ? workspace?.materialData : null;
    const cached = workspaceTabData || (tab==='products' ? window.currentShowProductData :
                   tab==='materials' ? window.currentShowMaterialData : null);
    const cachedId=String(cached?.booking?.ID || cached?.booking?.BookingID || currentId);
    if(cached && cachedId===currentId){
      const latestBooking=window.currentShowBooking;
      const latestBookingId=String(latestBooking?.ID || latestBooking?.BookingID || '');
      const merged=Object.assign({}, cached, {
        client:workspace?.client || {},
        booking:(latestBooking && latestBookingId===currentId) ? latestBooking : (cached.booking || workspace?.booking || {}),
        eventTime:workspace?.eventTime || cached.eventTime || '',
        // Crew pay and show expenses are computed at the workspace level (not per-tab).
        // Keep the top stat bar consistent no matter which tab is active.
        totals:Object.assign({}, cached.totals||{}, {
          crewCost:workspace?.totals?.crewCost || 0,
          expenseTotal:workspace?.totals?.expenseTotal || 0
        })
      });
      renderWorkspaceTabContent(merged,tab);
      return;
    }

    loadShowUsage(tab);
  }

  function loadShowUsage(tab,forceReload){
    if(!activeShowId)return;
    const requestedBookingId=String(activeShowId);
    const box=document.getElementById('workspaceTabContent');
    if(!box)return;

    const workspace=window.currentShowWorkspaceData;
    const workspaceId=String(workspace?.booking?.ID || workspace?.booking?.BookingID || requestedBookingId);

    if(!forceReload && tab!=='products' && tab!=='materials' && workspace && workspaceId===requestedBookingId){
      renderWorkspaceTabContent(workspace,tab);
      return;
    }

    const workspaceTabData = tab==='products' ? workspace?.productData :
                             tab==='materials' ? workspace?.materialData : null;
    const cached = !forceReload && (workspaceTabData || (tab==='products' ? window.currentShowProductData :
                   tab==='materials' ? window.currentShowMaterialData : null));
    const cachedId=String(cached?.booking?.ID || cached?.booking?.BookingID || requestedBookingId);
    if(cached && cachedId===requestedBookingId){
      const latestBooking=window.currentShowBooking;
      const latestBookingId=String(latestBooking?.ID || latestBooking?.BookingID || '');
      const merged=Object.assign({}, cached, {
        client:workspace?.client || {},
        booking:(latestBooking && latestBookingId===requestedBookingId) ? latestBooking : (cached.booking || workspace?.booking || {}),
        eventTime:workspace?.eventTime || cached.eventTime || '',
        totals:Object.assign({}, cached.totals||{}, {
          crewCost:workspace?.totals?.crewCost || 0,
          expenseTotal:workspace?.totals?.expenseTotal || 0
        })
      });
      renderWorkspaceTabContent(merged,tab);
      return;
    }

    // This path is used only when a forced refresh is needed after a write,
    // or for tabs (products/materials) that are backed by a dedicated endpoint.
    const usesWorkspaceEndpoint = tab!=='products' && tab!=='materials';
    const serverFn = tab==='products' ? 'getShowProductData' :
                     tab==='materials' ? 'getShowMaterialData' : 'getShowWorkspace';

    box.innerHTML='<div class="loading-card">Loading '+(tab==='products'?'products':tab==='crew'?'crew':tab==='expenses'?'expenses':tab==='payments'?'payments':'show')+'...</div>';

    google.script.run.withSuccessHandler(function(r){
      if(String(activeShowId||'')!==requestedBookingId)return;
      if(!r||!r.ok){box.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load show.')+'</div>';return;}

      const b=r.booking||{};
      const existingBooking=window.currentShowBooking||{};
      const existingEventTime=String(existingBooking['Event Time']||existingBooking.EventTime||existingBooking.Time||'').trim();
      const serverEventTime=String(r.eventTime||b['Event Time']||b.EventTime||b.Time||'').trim();
      r.eventTime=serverEventTime||existingEventTime;
      b['Event Time']=r.eventTime;
      window.currentShowBooking=b;

      if(usesWorkspaceEndpoint){
        // getShowWorkspace refreshes the entire workspace payload (usage, crew,
        // payments, expenses, totals) - update the shared cache so every tab
        // (including Overview and the top stat bar) reflects the latest data.
        window.currentShowWorkspaceData = r;
        renderShowSummaryCard(b, r.client && r.client.Name);
      }else{
        r.client=workspace?.client || r.client || {};
        // Crew pay and show expenses are computed at the workspace level. Merge
        // them in here too so the top stat bar stays correct while viewing
        // the Products/Materials tab.
        r.totals=Object.assign({}, r.totals||{}, {
          crewCost:workspace?.totals?.crewCost || 0,
          expenseTotal:workspace?.totals?.expenseTotal || 0
        });
      }

      if(tab==='products') window.currentShowProductData=r;
      if(tab==='materials') window.currentShowMaterialData=r;
      window.currentShowUsageData=null;

      renderWorkspaceTabContent(r,tab);
    }).withFailureHandler(function(x){
      if(String(activeShowId||'')!==requestedBookingId)return;
      box.innerHTML='<div class="error-card">'+esc(x&&x.message||'Unable to load '+(tab==='products'?'products':tab==='materials'?'materials':tab==='crew'?'crew':'show')+'.')+'</div>';
    })[serverFn](state.token,requestedBookingId,true);
  }

  function renderWorkspaceTabContent(r,tab){
    const b=r.booking||{};
    const box=document.getElementById('workspaceTabContent');
    if(!box)return;
    const productCost=Number(r.totals?.productCost||0);
    const materialCost=Number(r.totals?.materialCost||0);
    const productSellingTotal=Number(r.totals?.productSellingTotal||0);
    const crewCost=Number(r.totals?.crewCost||0);
    const expenseTotal=Number(r.totals?.expenseTotal||0);
    // Booking Amount is the Products Total Amount (pre-tax). The booking record
    // is updated from Product usage, with productSellingTotal as a safe fallback.
    const revenue=Number(b.Subtotal ?? productSellingTotal ?? 0);
    const taxAmount=(Number(b.Tax||0)>0 ? Number(b.Tax) : Math.max(0,revenue-Number(b.Discount||b['Discount Amount']||0))*0.05);
    const paid=Number(b['Paid Amount']||b.DownPayment||b['Down Payment']||0);
    const balance=Math.max(0,revenue+taxAmount-paid);

    document.getElementById('workspaceStats').innerHTML=`
      ${workspaceStatUI('Booking Amount',money(revenue),'gold-stat')}
      ${workspaceStatUI('5% Tax',money(taxAmount),'')}
      ${workspaceStatUI('Amount Paid',money(paid),'')}
      ${workspaceStatUI('Balance',money(balance),'')}
      ${workspaceStatUI('Material Cost',money(materialCost),'')}
      ${workspaceStatUI('Total Expenses',money(expenseTotal),'')}
      ${workspaceStatUI('Profit',money(revenue-productCost-materialCost-crewCost-expenseTotal),'profit-stat')}
    `;

    if(tab==='overview')box.innerHTML=clientOverviewUI(r);
    else if(tab==='products')box.innerHTML=usageWorkspaceUI(r,'Product','Products');
    else if(tab==='materials')box.innerHTML=usageWorkspaceUI(r,'Material','Materials');
    else if(tab==='crew')box.innerHTML=crewWorkspaceUI(r);
    else if(tab==='expenses')box.innerHTML=expensesWorkspaceUI(r);
    else if(tab==='payments')box.innerHTML=paymentsWorkspaceUI(r);
    else box.innerHTML=profitWorkspaceUI(r);
  }

  function stockBadge(item){
    const available=Number(item?.AvailableStock||0);
    const minimum=Number(item?.MinimumStock||0);
    const status=available<=0?'Out of Stock':available<=minimum?'Low Stock':'In Stock';
    const cls=status==='Out of Stock'?'stock-out':status==='Low Stock'?'stock-low':'stock-ok';
    return `<span class="${cls}">${esc(status)}</span>`;
  }

  function statusClass(status){
    status=String(status||'').trim();
    if(status==='Out of Stock') return 'stock-out';
    if(status==='Low Stock') return 'stock-low';
    return 'stock-ok';
  }

            <tbody>

                <tr>
                  <td><strong>${esc(u['Item Name'])}</strong></td>

                  <td>${esc(u.Quantity)}</td>
                  <td>${esc(u['Remaining Stock']??'—')}</td>
                  <td>${money((items.find(function(i){ return String(i.ID||i.ProductID||'')===String(u.ItemID||''); })?.['Unit Cost'] ?? items.find(function(i){ return String(i.ID||i.ProductID||'')===String(u.ItemID||''); })?.UnitCost ?? u['Unit Cost'] ?? u['Purchase Cost'] ?? 0))}</td>
                  ${title==='Products'?`<td>${money(getItemSellingPrice(items,u.ItemID) || u['Selling Price'] || 0)}</td><td>${money(Number(u['Total Selling Price']||((getItemSellingPrice(items,u.ItemID)||u['Selling Price']||0)*Number(u.Quantity||0))) )}</td>`:''}

            </tbody>
          </table>
        </div>
        ${title==='Products'?`<div class="usage-total-row" style="margin-top:10px;"><span>Total Amount</span><strong>${money(usage.reduce(function(sum,u){ return sum + Number(u['Total Selling Price'] || ((getItemSellingPrice(items,u.ItemID)||u['Selling Price']||0)*Number(u.Quantity||0))); },0))}</strong></div>`:''}
      </div>

      <div class="workspace-section-card">
        <div class="section-card-head"><div><div class="section-card-title">Current Inventory</div><div class="section-card-sub">Live stock after show usage.</div></div></div>

          <div class="stock-card">

  function removeShowUsageUI(usageId){
    const id=String(usageId||'').trim();
    if(!id){
      toast('Product usage ID is missing.');
      return;
    }

    if(!window.confirm('Remove this product from the show? The quantity will be returned to inventory.')) return;

    google.script.run
      .withSuccessHandler(function(r){
        if(!r || !r.ok){
          toast(r && r.message || 'Unable to remove product.');
          return;
        }
        toast(r.message || 'Product removed and stock restored.');
        loadShowUsage('products',true);
      })
      .withFailureHandler(function(err){
        toast(err && err.message || 'Unable to remove product.');
      })
      .removeShowUsage(state.token,id);

  function getItemMinimum(items,id){
    const i=(items||[]).find(x=>String(x.ID)===String(id));
    return Number(i?.MinimumStock||0);
  }

    const i=(items||[]).find(x=>String(x.ID||x.ProductID||'')===String(id||''));

    if(!activeShowId)return;

    const selected=getSelectedProductUsageItems();

    showDialog(`
      <div class="dialog-card" style="max-width:820px;">
        <div class="dialog-head">

            <div class="dialog-title">Add Products to Show</div>
            <div class="dialog-subtitle">Add multiple products before saving. Inventory is deducted only when you save.</div>

          <button class="dialog-close" onclick="closeDialog(); window.selectedProductUsageItems=[];">×</button>
        </div>

        <div class="section-card-card" style="margin-bottom:12px;">

            <div>

              <div style="display:grid;grid-template-columns:minmax(0,1fr) 130px 110px 70px;gap:10px;align-items:center;padding:10px 11px;border:1px solid #292929;border-radius:10px;background:#0e0e0e;">

          }).join('') : '<div class="workspace-empty small">No products added yet. Click <strong>+ Add Product</strong> to select products.</div>'}
        </div>

        <div id="selectedProductUsageTotal" class="usage-total-row" style="margin-top:12px;">
          <span>Total Product Cost</span>
          <strong>${money(selected.reduce(function(sum,row){ return sum + Number(row.quantity||0) * Number(row['Unit Cost']||row.UnitCost||row['Purchase Cost']||row.PurchaseCost||0); },0))}</strong>
        </div>

        <div class="dialog-actions">
          <button type="button" class="btn" onclick="closeDialog(); window.selectedProductUsageItems=[];">Cancel</button>
          <button id="saveUsageBtn" class="btn gold" type="button" onclick="submitMultipleProductUsage()" ${selected.length?'':'disabled'}>Save Product Usage</button>
        </div>
      </div>
    `);

  function updateSelectedProductQuantity(index,value){
    const selected=getSelectedProductUsageItems();
    if(!selected[index])return;

    // Update the in-memory value WITHOUT re-rendering the whole dialog.
    // Re-rendering here replaces the input element on every keystroke, which
    // causes focus to be lost after each number typed.
    const raw=String(value ?? '');
    const qty=Math.max(0,Number(raw || 0));
    selected[index].quantity=qty;

    const list=document.getElementById('selectedProductUsageList');
    const rowEl=list && list.children ? list.children[index] : null;
    if(rowEl){
      const stock=Number(selected[index].AvailableStock||0);
      const remaining=stock-qty;
      const minimum=Number(selected[index].MinimumStock||0);
      const status=remaining<=0?'Out of Stock':remaining<=minimum?'Low Stock':'In Stock';

      const info=rowEl.children[2];
      if(info){
        const remainingStrong=info.querySelector('strong');
        const statusSpan=info.querySelector('span:last-child');
        if(remainingStrong) remainingStrong.textContent=Math.max(0,remaining)+' '+String(selected[index].Unit||'');
        if(statusSpan){
          statusSpan.textContent=status;
          statusSpan.className=statusClass(status);
          statusSpan.style.display='block';
          statusSpan.style.marginTop='2px';
        }
      }
    }

    const totalEl=document.getElementById('selectedProductUsageTotal');
    if(totalEl){
      const total=selected.reduce(function(sum,row){
        return sum + Number(row.quantity||0) * Number(row['Unit Cost']||row.UnitCost||row['Purchase Cost']||row.PurchaseCost||0);
      },0);
      const strong=totalEl.querySelector('strong');
      if(strong) strong.textContent=money(total);
    }
  }

  function removeSelectedProduct(index){
    const selected=getSelectedProductUsageItems();
    if(index<0 || index>=selected.length)return;
    selected.splice(index,1);
    renderProductUsageDialog();
  }

  function getProductPickerItems(){
    const workspace=window.currentShowWorkspaceData||{};
    const productData=workspace.productData || window.currentShowProductData || {};
    const workspaceItems=Array.isArray(productData.items) ? productData.items : [];
    const master=Array.isArray(cachedProducts) ? cachedProducts : [];
    if(master.length){
      return master
        .filter(function(p){ return String(p.Status||'Active') !== 'Inactive'; })
        .map(function(p){
          const id=String(p.ID||p.ProductID||'');
          const stock=workspaceItems.find(function(i){ return String(i.ID||'')===id; });
          return Object.assign({},p,stock||{ID:id,Name:p.Name||'',Unit:p.Unit||''});
        });
    }
    return workspaceItems.filter(function(i){ return String(i.Type||'Product')==='Product'; });
  }

  function openProductPicker(){
    const pickerItems=getProductPickerItems();
    if(!pickerItems.length){
      google.script.run.withSuccessHandler(function(r){
        if(!r||!r.ok){ toast(r&&r.message||'Unable to load products.'); return; }
        cachedProducts=r.products||[];
        showProductPickerModal(getProductPickerItems());
      }).withFailureHandler(function(x){
        toast(x&&x.message||'Unable to load products.');
      }).getProducts(state.token);
      return;
    }
    showProductPickerModal(pickerItems);
  }

    showDialog(`
      <div class="dialog-card">
        <div class="dialog-head">
          <div><div class="dialog-title">Select Product</div><div class="dialog-subtitle">Search products from the Product module.</div></div>
          <button class="dialog-close" onclick="closeDialog(); renderProductUsageDialog()">×</button>
        </div>
        <div style="margin-bottom:12px;">
          <input id="productSearchInput" type="search" placeholder="Search product name..." oninput="renderProductPickerList(this.value)" autofocus>
        </div>
        <div id="productPickerList" style="max-height:360px;overflow:auto;display:grid;gap:8px;"></div>
        <div class="dialog-actions"><span></span><button type="button" class="btn" onclick="closeDialog(); renderProductUsageDialog()">Back</button></div>
      </div>
    `);

  function renderProductPickerList(query){
    const box=document.getElementById('productPickerList');
    if(!box)return;
    const q=String(query||'').trim().toLowerCase();
    const rows=(window.productPickerItems||[]).filter(function(p){
      return !q || String(p.Name||'').toLowerCase().includes(q);
    });
    if(!rows.length){
      box.innerHTML='<div class="workspace-empty small">No matching products.</div>';
      return;
    }
    box.innerHTML=rows.map(function(p){
      const id=String(p.ID||p.ProductID||'');
      const stock=Number(p.AvailableStock||0);
      const status=String(p.StockStatus||'In Stock');
      return `
        <button type="button" class="btn" style="width:100%;text-align:left;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;" onclick="selectProductForUsage('${esc(id)}')">
          <span><strong>${esc(p.Name||'Unnamed Product')}</strong><small style="display:block;color:#777;margin-top:3px;">${esc(p.Unit||'')} · Selling Price ${money(p['Selling Price']||p.SellingPrice||0)}</small></span>
          <span style="font-size:11px;">Stock ${esc(stock)} · ${esc(status)}</span>
        </button>`;
    }).join('');

  function selectProductForUsage(productId){
    const item=(window.productPickerItems||[]).find(function(p){
      return String(p.ID||p.ProductID||'')===String(productId);
    });
    if(!item)return;

    const selected=getSelectedProductUsageItems();
    const id=String(item.ID||item.ProductID||'');
    const existing=selected.find(function(row){ return String(row.ID||'')===id; });
    if(existing){
      existing.quantity=Number(existing.quantity||0)+1;
    }else{
      selected.push(Object.assign({},item,{ID:id,quantity:0}));
    }
    closeDialog();
    renderProductUsageDialog();
  }

  function updateUsageStockPreview(){
    const id=document.getElementById('usageItem')?.value;
    const qty=Number(document.getElementById('usageQty')?.value||0);
    const box=document.getElementById('usageStockPreview');
    const item=(window.currentUsageItems||[]).find(i=>String(i.ID)===String(id));
    if(!box)return;
    if(!item){box.textContent='Select an item to see stock.';return;}
    const remaining=Number(item.AvailableStock||0)-qty;
    const status=remaining<=0?'Out of Stock':remaining<=Number(item.MinimumStock||0)?'Low Stock':'In Stock';
    box.innerHTML=`<div><span>Beginning Stock</span><strong>${esc(item.AvailableStock)} ${esc(item.Unit)}</strong></div><div><span>Quantity Used</span><strong>${esc(qty)} ${esc(item.Unit)}</strong></div><div><span>Remaining</span><strong>${Math.max(0,remaining)} ${esc(item.Unit)}</strong></div><div><span>Status</span><strong class="${statusClass(status)}">${status}</strong></div>`;
  }

  function submitMultipleProductUsage(){
    const selected=getSelectedProductUsageItems();
    if(!selected.length){ toast('Add at least one product.'); return; }

    const invalid=selected.find(function(row){
      const qty=Number(row.quantity||0);
      const stock=Number(row.AvailableStock||0);
      return qty<=0 || qty>stock;
    });
    if(invalid){
      toast('Check the quantity for ' + String(invalid.Name||'the selected product') + '.');
      return;
    }

    const b=document.getElementById('saveUsageBtn');
    setButtonLoading(b,true,'Saving...');

    const queue=selected.map(function(row){
      return {
        bookingId:activeShowId,
        usageType:'Product',
        itemId:String(row.ID||row.ProductID||''),
        quantity:Number(row.quantity||0)
      };
    });

    // Save every selected product in a single request instead of one
    // google.script.run call per product - each extra product used to add
    // its own full network round-trip, which made adding several products
    // at once noticeably slower than adding just one.
    google.script.run.withSuccessHandler(function(r){
      setButtonLoading(b,false,'Save Product Usage');
      if(!r||!r.ok){
        showDialogError(r&&r.message||'Unable to save product usage.');
        return;
      }
      window.selectedProductUsageItems=[];
      closeDialog();
      toast(r.message||'Product usage saved successfully.');

  function submitAssignEmployee(e){
    e.preventDefault();
    if(!activeShowId) return;

    const btn = document.getElementById('assignEmployeeBtn');
    setButtonLoading(btn,true,'Assigning...');

    // Safety timeout: never leave the dialog stuck on "Assigning...".
    clearTimeout(window.__assignEmployeeTimer);
    window.__assignEmployeeTimer = setTimeout(function(){
      if(btn && btn.disabled){
        setButtonLoading(btn,false,'Assign Employee');
        showDialogError('The server did not respond. Please try Assign Employee again.');
      }
    },30000);

    google.script.run
      .withSuccessHandler(function(r){
        clearTimeout(window.__assignEmployeeTimer);
        setButtonLoading(btn,false,'Assign Employee');
        if(!r || !r.ok){
          showDialogError(r && r.message || 'Unable to assign employee.');
          return;
        }
        closeDialog();
        toast(r.message || 'Employee assigned successfully.');

        // Immediately refresh the Client / Show Crew tab from the server
        // so the newly assigned employee appears without leaving the show.
        const crewTab = Array.from(document.querySelectorAll('.workspace-nav-btn'))
          .find(function(x){ return x.textContent.trim().toLowerCase() === 'crew'; });
        if(crewTab){
          document.querySelectorAll('.workspace-nav-btn').forEach(function(x){ x.classList.remove('active'); });
          crewTab.classList.add('active');
        }
        loadShowUsage('crew', true);

        if(typeof loadEmployees === 'function') loadEmployees();
      })
      .withFailureHandler(function(err){
        clearTimeout(window.__assignEmployeeTimer);
        setButtonLoading(btn,false,'Assign Employee');
        showDialogError(err && err.message || 'Unable to assign employee.');
      })
      .assignEmployeeToShow(state.token,{
        bookingId:activeShowId,
        employeeName:document.getElementById('crewEmployeeName').value,
        role:document.getElementById('crewEmployeeRole').value,
        employeeType:document.getElementById('crewEmployeeType').value,

    return `

          <button id="calWeekBtn" class="filter-btn" type="button" onclick="setCalendarView('week')">Week</button>

        </div>`)}
      <div class="calendar-toolbar" style="align-items:center;gap:10px;">
        <button class="btn" type="button" onclick="calendarPrev()">‹</button>
        <div class="calendar-title" id="calendarTitle">Loading...</div>
        <button class="btn" type="button" onclick="calendarNext()">›</button>
        <span></span>
        <button id="calAllBtn" class="filter-btn active" type="button" onclick="setCalendarFilter('all')">All</button>
        <button id="calBookingsBtn" class="filter-btn" type="button" onclick="setCalendarFilter('booking')">Bookings</button>
        <button id="calPaymentsBtn" class="filter-btn" type="button" onclick="setCalendarFilter('payment')">Payments</button>
        <button class="btn" type="button" onclick="loadCalendar()">Refresh</button>
      </div>
      <div id="calendarBody"><div class="loading-card">Loading calendar...</div></div>
    `;
  }

  function initCalendar(){
    const now = new Date();
    calendarState.year = now.getFullYear();
    calendarState.month = now.getMonth();
    calendarState.view = 'month';
    calendarState.filter = 'all';
    updateCalendarControls();
    loadCalendar();
  }

  function updateCalendarControls(){
    const map = {
      month: document.getElementById('calMonthBtn'),
      week: document.getElementById('calWeekBtn'),
      day: document.getElementById('calDayBtn')
    };
    Object.keys(map).forEach(function(k){
      if(map[k]) map[k].classList.toggle('active', calendarState.view === k);
    });
    const filters = {
      all: document.getElementById('calAllBtn'),
      booking: document.getElementById('calBookingsBtn'),
      payment: document.getElementById('calPaymentsBtn')
    };
    Object.keys(filters).forEach(function(k){
      if(filters[k]) filters[k].classList.toggle('active', calendarState.filter === k);
    });
  }

  function setCalendarView(view){
    calendarState.view=view;
    updateCalendarControls();
    renderCalendarBody();
  }

  function setCalendarFilter(filter){
    calendarState.filter=filter;
    updateCalendarControls();
    renderCalendarBody();
  }

  function calendarPrev(){
    if(calendarState.view==='day' || calendarState.view==='week'){
      const d = new Date(calendarState.year, calendarState.month, calendarState.view==='day'?1:1);
      if(calendarState.view==='day') d.setDate(d.getDate()-1);
      else d.setDate(d.getDate()-7);
      calendarState.year=d.getFullYear();
      calendarState.month=d.getMonth();
    }else{
      calendarState.month--;
      if(calendarState.month<0){calendarState.month=11;calendarState.year--;}
    }
    loadCalendar();
  }

  function calendarNext(){
    if(calendarState.view==='day' || calendarState.view==='week'){
      const d = new Date(calendarState.year, calendarState.month, 1);
      d.setDate(d.getDate()+(calendarState.view==='day'?1:7));
      calendarState.year=d.getFullYear();
      calendarState.month=d.getMonth();
    }else{
      calendarState.month++;
      if(calendarState.month>11){calendarState.month=0;calendarState.year++;}
    }
    loadCalendar();
  }

  function calendarToday(){
    const now=new Date();
    calendarState.year=now.getFullYear();
    calendarState.month=now.getMonth();
    loadCalendar();
  }

  function loadCalendar(){
    const body=document.getElementById('calendarBody');
    const title=document.getElementById('calendarTitle');
    if(!body)return;
    body.innerHTML='<div class="loading-card">Loading calendar...</div>';
    if(title){
      title.textContent=new Date(calendarState.year,calendarState.month,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'});
    }
    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){body.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load calendar.')+'</div>';return;}
      calendarState.events=r.events||[];
      renderCalendarBody();
    }).withFailureHandler(function(e){
      body.innerHTML='<div class="error-card">'+esc(e&&e.message||'Unable to load calendar.')+'</div>';
    }).getCalendarData(state.token,calendarState.year,calendarState.month);
  }

  function filteredCalendarEvents(){
    return (calendarState.events||[]).filter(function(e){
      return calendarState.filter==='all' || e.type===calendarState.filter;
    });
  }

  function renderCalendarBody(){
    const body=document.getElementById('calendarBody');
    if(!body)return;
    updateCalendarControls();
    const title=document.getElementById('calendarTitle');
    if(title){
      title.textContent=new Date(calendarState.year,calendarState.month,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'});
    }
    const events=filteredCalendarEvents();

    if(calendarState.view==='week'){
      body.innerHTML=renderCalendarWeek(events);
      return;
    }
    if(calendarState.view==='day'){
      body.innerHTML=renderCalendarDay(events);
      return;
    }

    const first=new Date(calendarState.year,calendarState.month,1);
    const startOffset=first.getDay();
    const daysInMonth=new Date(calendarState.year,calendarState.month+1,0).getDate();
    const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
    const cells=[];

    for(let i=0;i<totalCells;i++){
      const day=i-startOffset+1;
      if(day<1 || day>daysInMonth){
        cells.push('<div class="calendar-cell"></div>');
        continue;
      }
      const dateKey=String(calendarState.year)+'-'+String(calendarState.month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const dayEvents=events.filter(e=>e.date===dateKey);
      cells.push(`
        <div class="calendar-cell">
          <div class="calendar-day">${day}</div>
          ${dayEvents.map(function(e){
            const cls=e.type==='booking'?'gold-event':'';
            return `<button type="button" class="calendar-event ${cls}" onclick="openCalendarEvent('${esc(e.id)}')">${esc(e.title)}</button>`;
          }).join('')}
        </div>`);
    }

    body.innerHTML=`<div class="calendar-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return `<div class="calendar-head">${d}</div>`;}).join('')}
      ${cells.join('')}
    </div>`;
  }

  function renderCalendarWeek(events){
    const start=new Date(calendarState.year,calendarState.month,1);
    const sunday=new Date(start);
    sunday.setDate(start.getDate()-start.getDay());
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(sunday); d.setDate(sunday.getDate()+i);
      const key=d.toISOString().slice(0,10);
      const dayEvents=events.filter(e=>e.date===key);
      days.push(`<div class="calendar-cell" style="min-height:180px"><div class="calendar-day">${d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}</div>${dayEvents.map(e=>`<button type="button" class="calendar-event ${e.type==='booking'?'gold-event':''}" onclick="openCalendarEvent('${esc(e.id)}')">${esc(e.title)}</button>`).join('')}</div>`);
    }
    return `<div class="calendar-grid">${days.join('')}</div>`;
  }

  function renderCalendarDay(events){
    const d=new Date(calendarState.year,calendarState.month,1);
    const key=d.toISOString().slice(0,10);
    const dayEvents=events.filter(e=>e.date===key);
    return `<div class="panel"><div class="panel-head"><div><div class="panel-title">${esc(d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'}))}</div><div class="panel-subtitle">Scheduled events</div></div></div>${dayEvents.length?dayEvents.map(e=>`<button type="button" class="calendar-event ${e.type==='booking'?'gold-event':''}" style="display:block;width:100%;text-align:left;margin:8px 0" onclick="openCalendarEvent('${esc(e.id)}')"><strong>${esc(e.title)}</strong><br><span>${esc(e.client||e.details||'')}</span></button>`).join(''):'<div class="empty-state">No events for this day.</div>'}</div>`;

  let payrollLoadToken=0;

  function loadPayroll(){
    const panel=document.getElementById('payrollPanel');
    const period=document.getElementById('payrollPeriod')?.value || new Date().toISOString().slice(0,7);
    if(panel) panel.innerHTML='<div class="loading-card">Loading payroll...</div>';

    // If a slow/overlapping request finishes after a newer one already
    // rendered, ignore it - otherwise stale data (e.g. from before a payroll
    // record was processed) can overwrite the up-to-date table.
    const requestToken=++payrollLoadToken;

    let finished=false;
    const timeoutId=setTimeout(function(){
      if(finished || requestToken!==payrollLoadToken) return;
      if(panel) panel.innerHTML='<div class="error-card">Payroll is taking too long to load. Please refresh and try again.</div>';
    },15000);

    google.script.run
      .withSuccessHandler(function(r){
        finished=true; clearTimeout(timeoutId);
        if(requestToken!==payrollLoadToken) return;
        if(!r||!r.ok){
          if(panel) panel.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load payroll.')+'</div>';
          return;
        }

        const summary=document.getElementById('payrollSummary');
        if(summary){
          summary.innerHTML=
            uiStat('Gross Show Pay',money(r.totals.gross))+
            uiStat('Advance / Loan Deductions',money(r.totals.deductions))+
            uiStat('Estimated Net Pay',money(r.totals.net))+
            uiStat('Employees',r.totals.employees);
        }

        if(!r.rows.length){
          panel.innerHTML='<div class="panel"><div class="empty-state">No payrollable employee earnings for this period.</div></div>';
          return;
        }

        panel.innerHTML=`
          <div class="panel">
            <div class="panel-head">
              <div>
                <div class="panel-title">Payroll for ${esc(period)}</div>
                <div class="panel-subtitle">${esc(r.totals.processed||0)} payroll record${(r.totals.processed||0)===1?'':'s'} processed.</div>
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Shows</th>
                    <th>Gross Pay</th>
                    <th>Advance / Loan</th>
                    <th>Deduction</th>
                    <th>Net Pay</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${r.rows.map(x=>{
                    const detail = (x['Show Breakdown']||[]).map(b=>
                      `<div class="detail-row"><span>${esc(formatDate(b.eventDate))} · ${esc(b.eventName)}</span></div>`
                    ).join('');
                    return `
                      <tr>
                        <td>
                          <strong>${esc(x['Employee Name'])}</strong>
                          <div class="muted">${esc(x.Role||'')} · ${esc(x['Employee Type']||'')}</div>
                          ${detail ? `<div class="payroll-show-detail">${detail}</div>` : ''}
                        </td>
                        <td>${esc(x.Shows)}</td>
                        <td>${money(x['Gross Pay'])}</td>
                        <td><span class="badge ${Number(x['Advance / Loan Outstanding']||0)>0?'danger-badge':''}">${money(x['Advance / Loan Outstanding'])}</span></td>
                        <td>${money(x['Suggested Deduction'])}</td>
                        <td><strong>${money(x['Net Pay'])}</strong></td>
                        <td><span class="badge">${esc(x.Status)}</span></td>
                        <td>
                          ${x.Processed
                            ? `<button class="table-action danger-text" onclick="deletePayrollUI('${esc(x.PayrollID)}')">Delete</button>`
                            : x.Shows
                              ? `<button class="btn gold small" onclick="processPayrollUI('${esc(x.EmployeeID)}','${esc(period)}')">Process</button>`
                              : '—'}
                        </td>
                      </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
      })
      .withFailureHandler(function(e){
        finished=true; clearTimeout(timeoutId);
        if(requestToken!==payrollLoadToken) return;
        if(panel) panel.innerHTML='<div class="error-card">'+esc(e&&e.message||'Unable to load payroll.')+'</div>';
      })
      .getPayrollSummary(state.token,period);

  function formatFileSize(bytes){
    const n=Number(bytes||0);
    if(!n) return '—';
    if(n<1024) return n+' B';
    if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
    return (n/(1024*1024)).toFixed(1)+' MB';
  }

  function renderDocumentsModule(){
    const box=document.getElementById('documentsModuleList');

    if(category!=='all') rows=rows.filter(function(d){ return String(d.Category||'')===category; });
    if(search) rows=rows.filter(function(d){
      const haystack=(String(d.FileName||'')+' '+String(d.ClientName||'')).toLowerCase();

    box.innerHTML=rows.length?`<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>File</th><th>Category</th><th>Client / Booking</th><th>Size</th><th>Uploaded</th><th>Action</th></tr></thead><tbody>${rows.map(function(d){

  function submitUploadDocument(e){
    e.preventDefault();
    const fileInput=document.getElementById('docFile');
    const file=fileInput && fileInput.files && fileInput.files[0];
    if(!file){showDialogError('Please choose a file to upload.');return;}
    if(file.size>15*1024*1024){showDialogError('File is too large. Please upload files under 15 MB.');return;}

    const btn=document.getElementById('saveDocumentBtn');
    setButtonLoading(btn,true,'Uploading...');

    const reader=new FileReader();
    reader.onload=function(){
      const base64Data=String(reader.result||'').split(',')[1]||'';
      google.script.run.withSuccessHandler(function(r){
        setButtonLoading(btn,false,'Upload Document');
        if(!r||!r.ok){showDialogError(r&&r.message||'Unable to upload document.');return;}
        closeDialog();toast(r.message||'Document uploaded.');loadDocumentsModule();
      }).withFailureHandler(function(x){
        setButtonLoading(btn,false,'Upload Document');showDialogError(x&&x.message||'Unable to upload document.');
      }).uploadDocument(state.token,{
        category:document.getElementById('docCategory').value,
        fileName:file.name,
        mimeType:file.type||'application/octet-stream',
        base64Data:base64Data,
        bookingId:document.getElementById('docBookingId').value,
        notes:document.getElementById('docNotes').value
      });
    };
    reader.onerror=function(){
      setButtonLoading(btn,false,'Upload Document');
      showDialogError('Unable to read the selected file.');
    };
    reader.readAsDataURL(file);
  }

  function reportsMatchesDateRange(dateValue){
    const range=reportsDateFilter.range;
    if(range==='all') return true;
    const d=new Date(dateValue);
    if(isNaN(d.getTime())) return false;
    const now=new Date();
    if(range==='today'){
      return d.toDateString()===now.toDateString();
    }
    if(range==='week'){
      const start=new Date(now);
      start.setDate(now.getDate()-now.getDay());
      start.setHours(0,0,0,0);
      const end=new Date(start);
      end.setDate(start.getDate()+7);
      return d>=start && d<end;
    }
    if(range==='month'){
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    }
    if(range==='year'){
      return d.getFullYear()===now.getFullYear();
    }
    if(range==='custom'){
      const from=reportsDateFilter.from?new Date(reportsDateFilter.from+'T00:00:00'):null;
      const to=reportsDateFilter.to?new Date(reportsDateFilter.to+'T23:59:59'):null;
      if(from && d<from) return false;
      if(to && d>to) return false;
      return true;
    }
    return true;
  }

  function updateRestockUnitCost(){
    const id=document.getElementById('restockProduct')?.value;
    const product=(cachedProducts||[]).find(function(p){
      return String(p.ID||p.ProductID||'')===String(id||'');
    });
    const cost=document.getElementById('restockUnitCost');
    const info=document.getElementById('restockInfo');
    if(!product){
      if(cost)cost.value='';
      if(info)info.textContent='Select a product to see its current stock and unit.';
      return;
    }
    if(cost && !cost.value) cost.value=Number(product['Unit Cost'] ?? product['Purchase Cost'] ?? 0);
    const stock=Number(product['Current Stock'] ?? product['Available Stock'] ?? 0);
    if(info)info.textContent='Current stock: '+stock+' '+String(product.Unit||'')+' · Restocking '+String(product.Name||'');
  }

  function loanDateMonthKey_(value){
    const d=new Date(value);
    if(isNaN(d.getTime())) return '';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }

  function renderLoansModule(){
    const panel=document.getElementById('loanPanel');
    if(!panel) return;
    const searchEl=document.getElementById('loansSearchInput');
    const monthEl=document.getElementById('loansMonthFilter');
    const search=searchEl?searchEl.value.trim().toLowerCase():'';
    const month=monthEl?monthEl.value:'';

    let rows=cachedLoans;
    if(search) rows=rows.filter(function(l){ return String(l.Lender||'').toLowerCase().indexOf(search)!==-1; });
    if(month) rows=rows.filter(function(l){ return loanDateMonthKey_(l['Date Borrowed'])===month; });

    const total=rows.reduce((s,l)=>s+Number(l['Loan Amount']||0),0);
    const paid=rows.reduce((s,l)=>s+Number(l['Amount Paid']||0),0);
    const outstanding=rows.reduce((s,l)=>s+Number(l['Outstanding Balance']||0),0);

    const summary=document.getElementById('loanSummary');
    if(summary) summary.innerHTML=`
      <div class="loan-stat"><span>Total Loans</span><strong>${money(total)}</strong></div>
      <div class="loan-stat"><span>Total Paid</span><strong>${money(paid)}</strong></div>
      <div class="loan-stat"><span>Total Outstanding</span><strong>${money(outstanding)}</strong></div>
    `;

    const isFiltered=!!search||!!month;
    panel.innerHTML=`
      <div class="panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Borrowed From</th>
                <th>Loan Amount</th>
                <th>Loan %</th>
                <th>Paid</th>
                <th>Last Paid</th>
                <th>Outstanding</th>
                <th>Date Borrowed</th>
                <th>Due Date</th>
                <th>Purpose</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows.map(l=>`
                <tr>
                  <td><strong>${esc(l.Lender)}</strong></td>
                  <td>${money(l['Loan Amount'])}</td>
                  <td>${pct(l['Loan Percentage'])}</td>
                  <td>${money(l['Amount Paid'])}</td>
                  <td>${l['Last Payment Date']?esc(formatDate(l['Last Payment Date'])):'—'}</td>
                  <td><span class="badge ${Number(l['Outstanding Balance']||0)>0?'danger-badge':''}">${money(l['Outstanding Balance'])}</span></td>
                  <td>${esc(formatDate(l['Date Borrowed']))}</td>
                  <td>${esc(formatDate(l['Due Date']))}</td>
                  <td>${esc(l.Purpose||'—')}</td>
                  <td>
                    ${Number(l['Outstanding Balance']||0)>0
                      ? `<button class="table-action" onclick='recordLoanPaymentUI(${JSON.stringify(l).replace(/'/g,"&#39;")})'>Pay</button>`
                      : `<span class="badge">Paid</span>`}
                    <button class="table-action" onclick="openLoanPaymentHistory('${esc(l.ID||l.LoanID||'')}')">History</button>
                    <button class="table-action danger-text" onclick="confirmDeleteLoanModule('${esc(l.ID||l.LoanID||'')}')">Delete</button>
                  </td>

            </tbody>
