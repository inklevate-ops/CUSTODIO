<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUSTODIO SUPLICO FIREWORKS</title>

  <style>
    :root{
      --bg:#080808;
      --panel:#121212;
      --panel2:#181818;
      --line:#2a2a2a;
      --text:#f7f7f7;
      --muted:#999;
      --gold:#d7ad55;
      --gold2:#f2cf7b;
      --danger:#e66d6d;
      --success:#78d499;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    button,input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{display:none!important}

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 20% 20%,rgba(215,173,85,.12),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(215,173,85,.06),transparent 30%),
        #080808;
    }

    .card{
      width:min(460px,100%);
      padding:32px;
      border-radius:24px;
      border:1px solid #292929;
      background:rgba(18,18,18,.92);
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      backdrop-filter:blur(16px);
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand-mark{
      width:72px;
      height:72px;
      margin:0 auto 16px;
      display:grid;
      place-items:center;
      border-radius:20px;
      background:#0e0e0e;
      border:1px solid #303030;
      color:var(--gold2);
      font-weight:900;
      letter-spacing:.08em;
    }

    h1{
      margin:0;
      font-size:25px;
      letter-spacing:.04em;
    }

    .subtitle{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
    }

    .field{
      margin-bottom:16px;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      color:#cfcfcf;
      font-size:12px;
    }

    .field input{
      width:100%;
      padding:13px 14px;
      color:#fff;
      background:#0d0d0d;
      border:1px solid #303030;
      border-radius:12px;
      outline:none;
      transition:.18s ease;
    }

    .field input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(215,173,85,.08);
    }

    .password-wrap{
      display:flex;
      gap:8px;
    }

    .password-wrap input{
      min-width:0;
      flex:1;
    }

    .btn{
      border:1px solid #343434;
      background:#1a1a1a;
      color:#fff;
      padding:11px 14px;
      border-radius:12px;
      transition:.18s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:#555;
      background:#222;
      box-shadow:0 8px 24px rgba(0,0,0,.24);
    }

    .btn:active{
      transform:translateY(0);
    }

    .btn:disabled{
      opacity:.7;
      cursor:not-allowed;
      transform:none;
    }

    .btn.gold{
      width:100%;
      margin-top:8px;
      border:0;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#111;
      font-weight:800;
    }

    .btn.loading{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:9px;
    }

    .spinner{
      width:15px;
      height:15px;
      border:2px solid rgba(17,17,17,.25);
      border-top-color:#111;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .remember{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:12px;
    }

    .status{
      min-height:20px;
      margin:8px 0;
      font-size:13px;
    }

    .status.error{color:#ff9898}
    .status.success{color:var(--success)}

    .dashboard{
      min-height:100vh;
      padding:28px;
      background:
        radial-gradient(circle at top right,rgba(215,173,85,.08),transparent 28%),
        #080808;
    }

    .dashboard-inner{
      max-width:1100px;
      margin:0 auto;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:22px;
    }

    .eyebrow{
      color:var(--gold2);
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .welcome{
      margin-top:6px;
      font-size:26px;
      font-weight:800;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
    }

    .status-card{
      padding:14px 16px;
      border:1px solid #2d2d2d;
      border-radius:14px;
      background:#111;
      color:#bfbfbf;
      font-size:12px;
    }

    .dot{
      display:inline-block;
      width:8px;
      height:8px;
      margin-right:7px;
      border-radius:50%;
      background:var(--success);
    }

    .test-card{
      margin-top:16px;
      padding:18px;
      border:1px solid #2b2b2b;
      border-radius:16px;
      background:#111;
    }

    @media(max-width:700px){
      .top{
        flex-direction:column;
      }

      .dashboard{
        padding:16px;
      }
    }
  
    .app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr;background:#080808}
    .sidebar{position:sticky;top:0;height:100vh;padding:16px;background:linear-gradient(180deg,#0b0b0b,#111);border-right:1px solid #272727;display:flex;flex-direction:column}
    .side-brand{display:flex;align-items:center;gap:10px;padding:8px 6px 18px;border-bottom:1px solid #292929}
    .brand-mark.small{width:42px;height:42px;margin:0;border-radius:12px;font-size:12px}
    .side-title{font-size:11px;font-weight:800;letter-spacing:.08em}
    .side-subtitle{font-size:10px;color:#666;margin-top:2px}
    .side-nav{flex:1;padding:14px 0;overflow:auto}
    .nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:3px;border:0;border-radius:11px;background:transparent;color:#aaa;text-align:left;transition:.18s ease}
    .nav-btn:hover{background:#1b1b1b;color:#fff}
    .nav-btn.active{background:#1a1a1a;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
    .nav-icon{width:18px;text-align:center;color:#888}
    .nav-btn.active .nav-icon{color:var(--gold2)}
    .logout-nav{margin-top:10px}
    .main-shell{min-width:0}
    .topbar{height:70px;padding:12px 22px;border-bottom:1px solid #282828;background:rgba(9,9,9,.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between}
    .breadcrumb{font-size:11px;color:#777}
    .page-title{font-size:20px;font-weight:800;margin-top:2px}
    .profile-chip{display:flex;align-items:center;gap:9px}
    .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#aa8029,#edd07a);color:#111;font-weight:900}
    .profile-name{font-size:12px;color:#aaa}
    .module-content{padding:22px;max-width:1800px;margin:0 auto}
    .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
    .section-title{font-size:18px;font-weight:800}
    .section-subtitle{font-size:12px;color:#777;margin-top:4px}
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
    .metric-card{padding:16px;border:1px solid #2a2a2a;border-radius:16px;background:linear-gradient(180deg,#151515,#101010)}
    .metric-label{font-size:11px;color:#858585}
    .metric-value{font-size:23px;font-weight:800;margin-top:7px}
    .dashboard-columns{display:grid;grid-template-columns:1.35fr .95fr;gap:16px;margin-bottom:16px}
    .panel{padding:18px;border:1px solid #2a2a2a;border-radius:17px;background:linear-gradient(180deg,#131313,#101010);margin-bottom:16px}
    .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
    .panel-title{font-weight:800}
    .panel-subtitle{font-size:11px;color:#777;margin-top:3px}
    .btn.small{padding:8px 11px;font-size:12px}
    .table-wrap{overflow:auto;border:1px solid #242424;border-radius:12px}
    .data-table{width:100%;border-collapse:collapse;min-width:560px}
    .data-table th,.data-table td{padding:10px 11px;border-bottom:1px solid #222;text-align:left;font-size:12px;white-space:nowrap}
    .data-table th{color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:#111}
    .data-table tr:hover td{background:#151515}
    .badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(215,173,85,.11);color:var(--gold2);font-size:10px}
    .empty-state{padding:34px;text-align:center;color:#777}.empty-state-title{font-weight:800;color:#ddd;margin-bottom:6px}.empty-state-sub{font-size:11px;color:#777}.table-actions{display:flex;gap:6px;align-items:center}.full-width{grid-column:1/-1}
    .loading-card,.error-card{padding:30px;border:1px solid #2b2b2b;border-radius:16px;background:#111;color:#aaa}
    .error-card{color:#ff9b9b;border-color:#6d3838}
    .activity-list{display:grid;gap:0}
    .activity-row{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #202020}
    .activity-row:last-child{border-bottom:0}
    .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:5px;flex:0 0 auto}
    .activity-main{min-width:0;flex:1}
    .activity-title{font-size:12px;font-weight:700}
    .activity-sub{font-size:11px;color:#777;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .activity-time{font-size:10px;color:#666;white-space:nowrap}

    @media(max-width:1000px){
      .metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .dashboard-columns{grid-template-columns:1fr}
    }
    @media(max-width:800px){
      .app-shell{grid-template-columns:1fr}
      .sidebar{position:fixed;left:-270px;z-index:100;width:250px;transition:.2s}
      .profile-name{display:none}
      .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .module-content{padding:14px}
    }
    @media(max-width:520px){
      .metric-grid{grid-template-columns:1fr}
      .topbar{padding:10px 14px}
    }

  
    .action-row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid #242424}.tab{border:0;background:transparent;color:#777;padding:10px 13px;border-bottom:2px solid transparent;cursor:pointer}.tab:hover{color:#fff}.tab.active{color:var(--gold2);border-color:var(--gold)}
    .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:#8b8b8b}.form-grid input,.form-grid select,.form-grid textarea,#globalDialog input,#globalDialog select,#globalDialog textarea{width:100%;box-sizing:border-box;background:#0c0c0c;border:1px solid #2a2a2a;color:#eee;border-radius:10px;padding:10px 11px;outline:none}
    textarea{min-height:80px;resize:vertical}.form-grid input:focus,.form-grid select:focus,#globalDialog input:focus,#globalDialog select:focus,#globalDialog textarea:focus{border-color:#80632b;box-shadow:0 0 0 3px rgba(214,173,85,.07)}
    .dialog-actions{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:16px}.inner-panel{margin:12px 0}.package-item{display:grid;grid-template-columns:1.7fr .6fr .8fr auto;gap:8px;margin-bottom:8px}.table-action{border:0;background:transparent;color:var(--gold2);cursor:pointer;padding:4px 6px}.danger-text{color:#ef8585}.danger-badge{background:rgba(200,70,70,.12);color:#ff9b9b}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:500;backdrop-filter:blur(8px)}.modal.show{display:flex}.dialog-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #303030;border-radius:18px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.dialog-card.wide{width:min(980px,100%)}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px}.dialog-title{font-size:18px;font-weight:800}.dialog-subtitle{font-size:11px;color:#777;margin-top:4px}.dialog-close{border:0;background:transparent;color:#888;font-size:25px;cursor:pointer}.dialog-close:hover{color:#fff}.dialog-error{padding:10px 12px;background:rgba(180,60,60,.1);border:1px solid #633535;color:#ff9e9e;border-radius:10px;margin-bottom:12px;font-size:12px}
    .toast{position:fixed;right:20px;bottom:20px;z-index:700;padding:12px 15px;background:#161616;border:1px solid #383838;border-radius:12px;color:#eee;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:-2px}.small-spinner{width:11px;height:11px}@keyframes spin{to{transform:rotate(360deg)}}button:disabled{opacity:.55;cursor:not-allowed}
    @media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.package-item{grid-template-columns:1fr 1fr}.dialog-actions{grid-template-columns:1fr}.action-row{width:100%}}


    .source-switch{display:flex;gap:6px;padding:4px;background:#0d0d0d;border:1px solid #272727;border-radius:12px;width:max-content;margin-bottom:14px}
    .source-btn{border:1px solid transparent;background:transparent;color:#777;font-weight:800;font-size:11px;letter-spacing:.08em;padding:10px 16px;border-radius:8px;cursor:pointer;transition:.18s}
    .source-btn:hover{color:#fff;background:#171717}
    .source-btn.active{color:#0d0d0d;background:var(--gold2);box-shadow:0 5px 18px rgba(214,173,85,.14)}


    .client-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .search-box{display:flex;align-items:center;gap:8px;background:#0d0d0d;border:1px solid #282828;border-radius:11px;padding:0 11px;width:min(420px,100%);transition:.18s}
    .search-box:focus-within{border-color:#80632b;box-shadow:0 0 0 3px rgba(214,173,85,.06)}
    .search-box span{color:#777;font-size:18px}.search-box input{border:0!important;background:transparent!important;box-shadow:none!important;padding:10px 0!important}


    .workspace-dialog{max-width:900px!important}
    .workspace-section{padding:14px 0;border-bottom:1px solid #242424}
    .workspace-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--gold2);margin-bottom:12px}
    .tax-preview{display:flex;justify-content:space-between;gap:16px;margin:14px 0;padding:13px 15px;border:1px solid #292929;border-radius:12px;background:#101010}
    .tax-preview div{display:flex;flex-direction:column;gap:4px}.tax-preview span{font-size:11px;color:#777}.tax-preview strong{font-size:13px;color:#eee}


    .dashboard-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
    .dashboard-metrics .metric-card{min-height:96px}
    .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .analytics-card{background:linear-gradient(180deg,#131313,#0f0f0f);border:1px solid #292929;border-radius:18px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.15)}
    .analytics-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .analytics-stat{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .analytics-stat span{font-size:10px;color:#6f6f6f;text-transform:uppercase;letter-spacing:.08em}
    .analytics-stat strong{font-size:12px;color:var(--gold2)}
    .chart-wrap{position:relative;height:280px;margin-top:12px;overflow:hidden}
    .chart-gridlines{position:absolute;inset:10px 0 34px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
    .gridline{border-top:1px solid #222}
    .bar-chart{position:absolute;inset:10px 0 0 0;display:flex;align-items:flex-end;gap:8px;padding:0 6px 0 6px}
    .bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:20px}
    .bar{width:min(34px,72%);background:linear-gradient(180deg,var(--gold2),#9c7228);border-radius:8px 8px 3px 3px;box-shadow:0 10px 24px rgba(215,173,85,.08);transition:height .25s ease}
    .bar:hover{filter:brightness(1.15);transform:translateY(-2px)}
    .bar-value{font-size:9px;color:#777;min-height:12px}
    .bar-label{font-size:9px;color:#666}
    .chart-footer{display:flex;justify-content:space-between;gap:12px;margin-top:4px;font-size:10px;color:#777}
    .sales-svg{width:100%;height:100%;overflow:visible}
    .svg-grid{stroke:#242424;stroke-width:1}
    .sales-area{fill:rgba(215,173,85,.10)}
    .sales-line{stroke:var(--gold2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .sales-point{fill:#111;stroke:var(--gold2);stroke-width:3;cursor:pointer}
    .sales-point:hover{r:6}
    .svg-label{fill:#666;font-size:9px}
    @media(max-width:950px){.analytics-grid{grid-template-columns:1fr}}


    .loan-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
    .loan-stat{padding:15px;border:1px solid #2a2a2a;border-radius:15px;background:#111;display:flex;flex-direction:column;gap:5px}
    .loan-stat span{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}.loan-stat strong{font-size:20px;color:#eee}
    @media(max-width:700px){.loan-summary{grid-template-columns:1fr}}


    .filter-row,.action-row,.expense-chips,.report-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .section-card-head .btn.gold{width:auto;margin-top:0;flex:0 0 auto;white-space:nowrap}
    .expense-chips.compact{margin:12px 0;gap:6px}
    .expense-chips.compact span{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid #2b2b2b;border-radius:999px;background:#151515;color:#aaa;font-size:10px;line-height:1}
    .expense-chips.compact span:first-child{border-color:#80632b;color:var(--gold2);background:rgba(215,173,85,.08)}
    .expense-table{border:1px solid #242424;border-radius:12px;overflow:auto}
    .filter-btn{border:1px solid #2b2b2b;background:#101010;color:#888;border-radius:9px;padding:8px 11px;font-size:11px}.filter-btn:hover,.filter-btn.active{color:#fff;border-color:#5b4a28;background:#171717}
    .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.mini-stat{padding:15px;border:1px solid #292929;border-radius:14px;background:#111;display:flex;flex-direction:column;gap:6px}.mini-stat span{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.07em}.mini-stat strong{font-size:19px;color:#eee}
    .split-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail-grid>div{padding:12px;border:1px solid #242424;border-radius:11px;background:#0e0e0e}.detail-grid span{display:block;font-size:10px;color:#666}.detail-grid strong{display:block;margin-top:5px;font-size:12px}
    .workspace-placeholder{margin-top:14px;padding:18px;border:1px dashed #343434;border-radius:12px;color:#777;text-align:center}.calendar-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}.calendar-title{font-size:18px;font-weight:800}.calendar-toolbar>span{flex:1}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #292929;border-radius:15px;overflow:hidden;background:#0f0f0f}.calendar-head{padding:10px;text-align:center;color:#777;font-size:10px;border-bottom:1px solid #222;background:#131313}.calendar-cell{height:100px;padding:8px;border-right:1px solid #1e1e1e;border-bottom:1px solid #1e1e1e}.calendar-day{font-size:11px;color:#777}.calendar-event{margin-top:8px;padding:5px 6px;border-radius:6px;background:#1a1a1a;border-left:3px solid var(--gold);font-size:9px;color:#ddd}.gold-event{background:rgba(215,173,85,.08)}

<body>

<div id="app"></div>

<script>
  const state = {
    token: localStorage.getItem('csf_phase1_token') || '',
    user: null
  };

  function esc(value){
    return String(value ?? '')
      .replace(/[&<>"']/g, ch => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[ch]));
  }

  function renderLogin(message=''){
    document.getElementById('app').innerHTML = `
      <div class="page">
        <div class="card">
          <div class="brand">
            <div class="brand-mark">CSF</div>
            <h1>CUSTODIO SUPLICO FIREWORKS</h1>
            <div class="subtitle">Business Management & Tracking System</div>
          </div>

          <form id="loginForm">
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                autocomplete="username"
                value="admin@custodiosuplico.com"
                required
              >
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input
                  id="password"
                  type="password"
                  autocomplete="current-password"
                  required
                >
                <button id="togglePassword" type="button" class="btn">Show</button>
              </div>
            </div>

            <div class="row">
              <label class="remember">
                <input id="remember" type="checkbox">
                Remember me
              </label>
            </div>

            <div id="loginStatus" class="status error">${esc(message)}</div>

            <button id="loginButton" type="submit" class="btn gold">
              <span id="loginText">Sign in</span>
              <span id="loginSpinner" class="spinner hidden"></span>
            </button>
          </form>
        </div>
      </div>
    `;

    document.getElementById('togglePassword')
      .addEventListener('click', togglePassword);

    document.getElementById('loginForm')
      .addEventListener('submit', submitLogin);

    testServer();
  }

  function togglePassword(){
    const field = document.getElementById('password');
    const button = document.getElementById('togglePassword');

    if(field.type === 'password'){
      field.type = 'text';
      button.textContent = 'Hide';
    }else{
      field.type = 'password';
      button.textContent = 'Show';
    }
  }

  function setLoginLoading(loading){
    const button = document.getElementById('loginButton');
    const text = document.getElementById('loginText');
    const spinner = document.getElementById('loginSpinner');

    if(!button) return;

    button.disabled = loading;
    button.classList.toggle('loading', loading);

    if(loading){
      text.textContent = 'Signing in...';
      spinner.classList.remove('hidden');
    }else{
      text.textContent = 'Sign in';
      spinner.classList.add('hidden');
    }
  }

  function showLoginError(message){
    const el = document.getElementById('loginStatus');
    if(el) el.textContent = message || '';
  }

  function testServer(){
    google.script.run
      .withSuccessHandler(function(result){
        if(!result || !result.ok){
          showLoginError('Server connection failed.');
        }
      })
      .withFailureHandler(function(error){
        showLoginError(
          'Server connection failed: ' +
          (error && error.message ? error.message : String(error))
        );
      })
      .pingServer();
  }

  function submitLogin(event){
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    showLoginError('');

    if(!email){
      showLoginError('Please enter your email.');
      return;
    }

    if(!password){
      showLoginError('Please enter your password.');
      return;
    }

    setLoginLoading(true);

    google.script.run
      .withSuccessHandler(function(result){
        setLoginLoading(false);

        if(!result || !result.ok){
          showLoginError(
            result && result.message
              ? result.message
              : 'Unable to sign in.'
          );
          return;
        }

        state.token = result.token;
        state.user = result.user;

        localStorage.setItem(
          'csf_phase1_token',
          result.token
        );

        renderDashboard();
      })
      .withFailureHandler(function(error){
        setLoginLoading(false);

        showLoginError(
          'Login failed: ' +
          (error && error.message
            ? error.message
            : String(error))
        );
      })
      .login(email, password, remember);
  }

  const MODULES = [
    ['Dashboard','⌂'],
    ['Calendar','▦'],
    ['Clients','▤'],
    ['Pending Clients','◷'],

    ['Products','◇'],
    ['Inventory','◉'],

    ['Loans','♢'],
    ['Employees','♙'],
    ['Payroll','₱'],
    ['Payments','₱'],
    ['Expenses','▣'],
    ['Documents','▤'],
    ['Reports','◍'],
    ['Notifications','◌'],
    ['Settings','⚙'],
    ['Admin Profile','●']
  ];

  let currentOpenModule = 'Dashboard';
  let moduleRenderToken = 0;

  function renderDashboard(){
    renderShell('Dashboard');
    loadDashboard(moduleRenderToken);
  }

  function renderShell(activeModule){
    currentOpenModule = activeModule;
    moduleRenderToken++;
    document.getElementById('app').innerHTML = `
      <div class="app-shell">
        <aside id="sidebar" class="sidebar">
          <div class="side-brand">
            <div class="brand-mark small">CSF</div>
            <div>
              <div class="side-title">CUSTODIO SUPLICO</div>
              <div class="side-subtitle">FIREWORKS ERP</div>
            </div>
          </div>

          <nav class="side-nav">
            ${MODULES.map(([name, icon]) => `
              <button class="nav-btn ${name === activeModule ? 'active' : ''}" onclick="openModule('${name.replace(/'/g, "\\'")}')">
                <span class="nav-icon">${icon}</span>
                <span>${esc(name)}</span>
              </button>
            `).join('')}
          </nav>

          <button class="nav-btn logout-nav" onclick="logout()">
            <span class="nav-icon">⟲</span>
            <span>Logout</span>
          </button>
        </aside>

        <main class="main-shell">
          <header class="topbar">
            <div>
              <div class="breadcrumb">ERP / ${esc(activeModule)}</div>
              <div class="page-title">${esc(activeModule)}</div>
            </div>

            <div class="profile-chip">
              <div class="avatar">
                ${esc((state.user && state.user['Full Name'] || 'A').slice(0,1).toUpperCase())}
              </div>
              <div class="profile-name">${esc(state.user && state.user['Full Name'] || 'Administrator')}</div>
            </div>
          </header>

          <section id="moduleContent" class="module-content">
            <div class="loading-card">Loading ${esc(activeModule)}...</div>
          </section>
        </main>
      </div>
    `;

    if(activeModule === 'Dashboard'){
      // Keep the dashboard request separate and direct, matching the stable pattern.

  function renderBookingBars(rows){

      return `
        <div class="bar-col" title="${esc(r.month)}: ${val} booking${val===1?'':'s'}">
          <div class="bar-value">${val}</div>
          <div class="bar" style="height:${height}%"></div>
          <div class="bar-label">${esc(r.month)}</div>
        </div>`;
    }).join('');
  }

  function renderSalesChart(rows){
    const values=rows.map(r=>Number(r.sales||0));
    const max=Math.max(1,...values);
    const width=720;
    const height=250;
    const left=28;
    const right=12;
    const top=18;
    const bottom=34;
    const chartW=width-left-right;
    const chartH=height-top-bottom;
    const points=rows.map((r,i)=>{
      const x=left+(i*(chartW/(rows.length-1)));
      const y=top+chartH-(Number(r.sales||0)/max*chartH);
      return {x,y};
    });

    const line=points.map(p=>`${p.x},${p.y}`).join(' ');
    const area=`${left},${top+chartH} ${line} ${left+chartW},${top+chartH}`;

    return `
      <svg viewBox="0 0 ${width} ${height}" class="sales-svg" role="img" aria-label="Monthly sales chart">
        ${[0,1,2,3,4].map(i=>{
          const y=top+(chartH*(i/4));
          return `<line x1="${left}" y1="${y}" x2="${left+chartW}" y2="${y}" class="svg-grid"/>`;
        }).join('')}
        <polygon points="${area}" class="sales-area"></polygon>
        <polyline points="${line}" class="sales-line" fill="none"></polyline>
        ${points.map((p,i)=>`
          <circle cx="${p.x}" cy="${p.y}" r="4" class="sales-point">
            <title>${esc(rows[i].month)}: ${money(rows[i].sales||0)}</title>
          </circle>
          <text x="${p.x}" y="${height-12}" text-anchor="middle" class="svg-label">${esc(rows[i].month)}</text>
        `).join('')}
      </svg>
    `;
  }

  function formatTimeInputValue(value){
    if(!value) return '';
    const s=String(value).trim().replace(/^'/,'').trim();
    if(!s) return '';

    // Check 12-hour first so "11:30 PM" is not parsed as 11:30 (AM).
    let m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
    if(m){
      let h=Number(m[1]), min=m[2], ap=m[3].toUpperCase();
      if(ap==='AM'&&h===12)h=0;
      if(ap==='PM'&&h!==12)h+=12;
      return String(h).padStart(2,'0')+':'+min;
    }

    m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if(m) return String(Number(m[1])).padStart(2,'0')+':'+m[2];

    if(/\d{4}-\d{2}-\d{2}[T ]/.test(s)){
      const d=new Date(s);
      if(!isNaN(d.getTime())){
        return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      }
    }
    return '';
  }
  function formatTime12(value){
    if(!value) return '';
    const s=String(value).trim().replace(/^'/,'').trim();
    if(!s) return '';

    // Already saved 12-hour text — show it as saved.
    let m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
    if(m){
      let h=Number(m[1]);
      const min=m[2];
      const ap=m[3].toUpperCase();
      if(h<1) h=12;
      if(h>12) h=((h-1)%12)+1;
      return h+':'+min+' '+ap;
    }

    // Legacy 24-hour HH:mm / HH:mm:ss
    m=s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if(m){
      let h=Number(m[1]);
      const min=m[2];
      const ap=h>=12?'PM':'AM';
      h=h%12||12;
      return h+':'+min+' '+ap;
    }

    // Sheets day-fraction
    if(/^0(?:\.\d+)?$/.test(s) || /^\d*\.\d+$/.test(s)){
      const fraction=Number(s);
      if(isFinite(fraction)){
        const totalMinutes=Math.round((fraction-Math.floor(fraction))*24*60);
        let h=Math.floor(totalMinutes/60)%24;
        const min=String(totalMinutes%60).padStart(2,'0');
        const ap=h>=12?'PM':'AM';
        h=h%12||12;
        return h+':'+min+' '+ap;
      }
    }

    // ISO / 1899 Sheets serial — use getHours(), not toLocaleTimeString()
    if(/\d{4}-\d{2}-\d{2}[T ]/.test(s)){
      const d=new Date(s);
      if(!isNaN(d.getTime())){
        let h=d.getHours();
        const min=String(d.getMinutes()).padStart(2,'0');
        const ap=h>=12?'PM':'AM';
        h=h%12||12;
        return h+':'+min+' '+ap;
      }
    }

    return s;
  }

      setButtonLoading(b,false,'Create Client / Show');

      closeDialog();

      address:document.getElementById('wsClientAddress').value,

  function loadClientShowList(){
    const box=document.getElementById('clientShowList');
    if(box) box.innerHTML='<div class="loading-card">Loading client/shows...</div>';

    google.script.run
      .withSuccessHandler(function(r){
        if(!r || !r.ok){
          if(box) box.innerHTML='<div class="error-card">'+esc(r && r.message || 'Unable to load client/shows.')+'</div>';
          return;
        }
        clientShowRows=Array.isArray(r.bookings) ? r.bookings : [];
        filterClientShowList();
      })
      .withFailureHandler(function(err){
        if(box) box.innerHTML='<div class="error-card">'+esc(err && err.message || 'Unable to load client/shows from the server.')+'</div>';
      })
      .getBookings(state.token);
  }

  function filterClientShowList(){
    const box=document.getElementById('clientShowList');
    if(!box)return;
    const q=String(document.getElementById('clientSearchUI')?.value||'').toLowerCase().trim();
    const rows=clientShowRows.filter(b=>{
      const text=[b['Client Name'],b['Event Name'],b['Event Type'],b.Location].join(' ').toLowerCase();
      const status=String(b['Booking Status']||'Pending');
      const statusOk=clientStatusFilter==='All'||status===clientStatusFilter;
      return statusOk && (!q||text.includes(q));
    });

    box.innerHTML=rows.length?`
      <div class="show-list">
        ${rows.map(b=>`
          <div class="show-list-row-wrap">
            <button class="show-list-row" onclick="openShowWorkspace('${esc(b.ID||b.BookingID)}')">
              <div><strong>${esc(b['Client Name']||'')}</strong><span>${esc(b['Event Name']||b['Event Type']||'')}</span></div>
              <div class="show-list-right"><strong>${money(b['Final Amount']||b['Total Amount Due']||0)}</strong><span>${esc(formatDate(b['Event Date']))}</span><span class="status-mini ${String(b['Booking Status'])==='Booked'?'status-booked':String(b['Booking Status'])==='Cancelled'?'status-cancelled':'status-pending'}">${esc(b['Booking Status']||'Pending')}</span></div>
            </button>
            <div class="show-row-actions">
              <button class="table-action" onclick="event.stopPropagation();openEditClientShow('${esc(b.ID||b.BookingID)}')">Edit</button>
              <button class="table-action danger-text" onclick="event.stopPropagation();deleteClientShowUI('${esc(b.ID||b.BookingID)}')">Delete</button>
            </div>
          </div>`).join('')}
      </div>
    `:`<div class="workspace-empty small">No client/show records yet.</div>`;
  }

  function saveEditedClientShow(e,bookingId){
    e.preventDefault();
    const btn=document.getElementById('saveEditClientBtn');
    setButtonLoading(btn,true,'Saving...');

    google.script.run.withSuccessHandler(function(r){
      setButtonLoading(btn,false,'Save Changes');

      address:document.getElementById('editClientAddress').value,
      eventType:document.getElementById('editEventType').value,
      eventName:document.getElementById('editEventName').value,
      eventDate:document.getElementById('editEventDate').value,
      eventTime:document.getElementById('editEventTime').value,

  function deleteClientShowUI(bookingId){
    const id=String(bookingId||'').trim();
    if(!id){
      toast('Client/show ID is missing.');
      return;
    }

    const confirmed=window.confirm('Delete this client/show permanently? This cannot be undone.');
    if(!confirmed) return;

    google.script.run
      .withSuccessHandler(function(r){
        if(!r || !r.ok){
          toast(r && r.message || 'Unable to delete client/show.');
          return;
        }

        toast('Client/show permanently deleted.');

        if(activeShowId===id){
          activeShowId='';
          const ws=document.getElementById('showWorkspace');
          const empty=document.getElementById('showWorkspaceEmpty');
          if(ws) ws.classList.add('hidden');
          if(empty) empty.classList.remove('hidden');
        }

        loadClientShowList();
      })
      .withFailureHandler(function(err){
        toast(err && err.message || 'Unable to delete client/show.');
      })
      .deleteClientShow(state.token,id);
  }

  function openShowWorkspace(bookingId){
    activeShowId=bookingId;
    document.getElementById('showWorkspaceEmpty')?.classList.add('hidden');
    document.getElementById('showWorkspace')?.classList.remove('hidden');

    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){toast(r&&r.message||'Unable to load show.');return;}

      const b=r.booking||{};
      r.eventTime = String(r.eventTime || b['Event Time'] || b.EventTime || b.Time || '').trim();
      b['Event Time'] = r.eventTime;

      document.getElementById('showSummary').innerHTML=`
        <div class="show-summary-card">
          <div><div class="eyebrow">CLIENT / SHOW</div><div class="show-title">${esc(r.client?.Name||b['Client Name']||'')}</div><div class="show-subtitle">${esc(b['Event Name']||b['Event Type']||'')} · ${esc(formatDate(b['Event Date']))}${b['Event Time']?' · '+esc(formatTime12(b['Event Time'])):''}</div></div>
          <div class="show-summary-right"><span class="status-badge">${esc(b['Booking Status']||'Draft')}</span><div class="show-location">${esc(b.Location||'')}</div></div>
        </div>`;
      window.currentShowBooking = b;
      loadShowUsage('overview');
    }).withFailureHandler(function(x){toast(x&&x.message||'Unable to load show.');}).getShowWorkspace(state.token,bookingId);

  function showWorkspaceTab(tab,btn){
    document.querySelectorAll('.workspace-nav-btn').forEach(x=>x.classList.remove('active'));
    if(btn)btn.classList.add('active');
    loadShowUsage(tab);
  }

  function loadShowUsage(tab){
    if(!activeShowId)return;
    const box=document.getElementById('workspaceTabContent');
    if(!box)return;

    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){box.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load show.')+'</div>';return;}

      const b=r.booking||{};
      // Preserve the Event Time already loaded for this show if the secondary
      // workspace request returns an empty value. This keeps Overview consistent
      // with the Edit form and prevents an empty response from replacing a valid time.
      const existingBooking = window.currentShowBooking || {};
      const existingEventTime = String(
        existingBooking['Event Time'] || existingBooking.EventTime || existingBooking.Time || ''
      ).trim();
      const serverEventTime = String(
        r.eventTime || b['Event Time'] || b.EventTime || b.Time || ''
      ).trim();
      r.eventTime = serverEventTime || existingEventTime;
      b['Event Time'] = r.eventTime;
      window.currentShowBooking=b;
      const productCost=Number(r.totals?.productCost||0);
      const materialCost=Number(r.totals?.materialCost||0);
      const revenue=Number(b['Final Amount']||b['Total Amount Due']||0);
      const paid=Number(b['Paid Amount']||b.DownPayment||0);
      const balance=Math.max(0,revenue-paid);

      document.getElementById('workspaceStats').innerHTML=`
        ${workspaceStatUI('Booking Amount',money(revenue),'gold-stat')}
        ${workspaceStatUI('5% Tax',money(b.Tax||0),'')}
        ${workspaceStatUI('Amount Paid',money(paid),'')}
        ${workspaceStatUI('Balance',money(balance),'')}
        ${workspaceStatUI('Material Cost',money(materialCost),'')}
        ${workspaceStatUI('Total Expenses',money(0),'')}
        ${workspaceStatUI('Profit',money(revenue-productCost-materialCost-(Number(b.Tax||0))),'profit-stat')}
      `;

      if(tab==='overview')box.innerHTML=clientOverviewUI(r);
      else if(tab==='products')box.innerHTML=usageWorkspaceUI(r,'Product','Products');
      else if(tab==='materials')box.innerHTML=usageWorkspaceUI(r,'Material','Materials');
      else if(tab==='crew')box.innerHTML=crewWorkspaceUI(r);
      else if(tab==='expenses')box.innerHTML=expensesWorkspaceUI(r);
      else if(tab==='payments')box.innerHTML=paymentsWorkspaceUI(r);
      else box.innerHTML=profitWorkspaceUI(r);
    }).withFailureHandler(function(x){box.innerHTML='<div class="error-card">'+esc(x&&x.message||'Unable to load show.')+'</div>';}).getShowWorkspace(state.token,activeShowId);
  }

  function detailRowsUI(items){
    return `<div class="detail-list">${items.map(x=>`<div><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div>`;

  function usageWorkspaceUI(data,type,title){
    const usage=(data.usage||[]).filter(u=>String(u['Usage Type'])===type);
    const total=usage.reduce((s,u)=>s+Number(u['Total Cost']||0),0);
    const items=(data.items||[]).filter(i=>i.Type===type);

    return `
      <div class="workspace-section-card">
        <div class="section-card-head"><div><div class="section-card-title">${title}</div><div class="section-card-sub">Quantity used automatically updates Inventory.</div></div>
        <div class="action-row">
          ${type==='Material'?'<button class="btn small" onclick="openQuickMaterialDialog()">+ New Material</button>':''}
          <button class="btn gold small" onclick="openUsageDialog('${type}')">+ Add ${type}</button>
        </div></div>

        <div class="usage-total-row"><span>${title==='Products'?'Product Cost':'Total Material Cost'}</span><strong>${money(total)}</strong></div>

        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>${title==='Products'?'Product':'Material'}</th><th>Beginning Stock</th><th>Quantity Used</th><th>Remaining</th><th>Purchase Cost</th><th>Total Cost</th><th>Status</th></tr></thead>
            <tbody>
              ${usage.length?usage.map(u=>`
                <tr>
                  <td><strong>${esc(u['Item Name'])}</strong></td>
                  <td>${esc(u['Beginning Stock']??'—')}</td>
                  <td>${esc(u.Quantity)}</td>
                  <td>${esc(u['Remaining Stock']??'—')}</td>
                  <td>${money(u['Purchase Cost'])}</td>
                  <td>${money(u['Total Cost'])}</td>
                  <td><span class="stock-badge ${statusClass(u['Remaining Stock']<=0?'Out of Stock':u['Remaining Stock']<=getItemMinimum(items,u.ItemID)?'Low Stock':'In Stock')}">${u['Remaining Stock']<=0?'Out of Stock':u['Remaining Stock']<=getItemMinimum(items,u.ItemID)?'Low Stock':'In Stock'}</span></td>
                </tr>`).join(''):`<tr><td colspan="7"><div class="workspace-empty small">No ${title.toLowerCase()} recorded for this show.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="workspace-section-card">
        <div class="section-card-head"><div><div class="section-card-title">Current Inventory</div><div class="section-card-sub">Live stock after show usage.</div></div></div>
        <div class="stock-grid">${items.map(i=>`
          <div class="stock-card">
            <div class="stock-card-title">${esc(i.Name)}</div>
            <div class="stock-card-meta">${esc(i.Unit)} · Purchase ${money(i.PurchaseCost)}</div>
            <div class="stock-card-bottom">${stockBadge(i)}</div>
          </div>`).join('')}</div>
      </div>
    `;

  function getItemMinimum(items,id){
    const i=(items||[]).find(x=>String(x.ID)===String(id));
    return Number(i?.MinimumStock||0);
  }

  function openUsageDialog(type){
    if(!activeShowId)return;
    const getter=type==='Product'?'getProductsForShow':'getMaterialsForShow';

    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){toast(r&&r.message||'Unable to load items.');return;}
      const items=r.items||[];

      showDialog(`
        <div class="dialog-card">
          <div class="dialog-head"><div><div class="dialog-title">Add ${esc(type)} to Show</div><div class="dialog-subtitle">Saving will automatically deduct inventory.</div></div><button class="dialog-close" onclick="closeDialog()">×</button></div>

          <form onsubmit="submitUsage(event,'${esc(type)}')">
            <div class="form-grid">
              <label>${esc(type)}<select id="usageItem" required onchange="updateUsageStockPreview()"><option value="">Select ${esc(type.toLowerCase())}</option>${items.map(i=>`<option value="${esc(i.ID)}">${esc(i.Name)} · Stock ${esc(i.AvailableStock)} · ${esc(i.StockStatus)}</option>`).join('')}</select></label>
              <label>Quantity Used<input id="usageQty" type="number" min="0.01" step="0.01" required oninput="updateUsageStockPreview()"></label>
            </div>
            <div id="usageStockPreview" class="stock-preview">Select an item to see stock.</div>
            <div class="dialog-actions"><span></span><button type="button" class="btn" onclick="closeDialog()">Cancel</button><button id="saveUsageBtn" class="btn gold" type="submit">Save ${esc(type)} Usage</button></div>
          </form>
        </div>
      `);

      window.currentUsageItems=items;
    }).withFailureHandler(function(x){toast(x&&x.message||'Unable to load '+type.toLowerCase()+'s.');})[getter](state.token);
  }

  function updateUsageStockPreview(){
    const id=document.getElementById('usageItem')?.value;
    const qty=Number(document.getElementById('usageQty')?.value||0);
    const box=document.getElementById('usageStockPreview');
    const item=(window.currentUsageItems||[]).find(i=>String(i.ID)===String(id));
    if(!box)return;
    if(!item){box.textContent='Select an item to see stock.';return;}

    const remaining=Number(item.AvailableStock||0)-qty;
    const status=remaining<=0?'Out of Stock':remaining<=Number(item.MinimumStock||0)?'Low Stock':'In Stock';

    box.innerHTML=`
      <div><span>Beginning Stock</span><strong>${esc(item.AvailableStock)} ${esc(item.Unit)}</strong></div>
      <div><span>Quantity Used</span><strong>${esc(qty)} ${esc(item.Unit)}</strong></div>
      <div><span>Remaining</span><strong>${Math.max(0,remaining)} ${esc(item.Unit)}</strong></div>
      <div><span>Status</span><strong class="${statusClass(status)}">${status}</strong></div>
    `;
  }

  function submitUsage(e,type){
    e.preventDefault();
    const b=document.getElementById('saveUsageBtn');setButtonLoading(b,true,'Saving...');

    const payload={bookingId:activeShowId,quantity:document.getElementById('usageQty').value};
    if(type==='Product')payload.productId=document.getElementById('usageItem').value;
    else payload.materialId=document.getElementById('usageItem').value;

    const fn=type==='Product'?'saveProductUsage':'saveMaterialUsage';

    google.script.run.withSuccessHandler(function(r){
      setButtonLoading(b,false,'Save '+type+' Usage');
      if(!r||!r.ok){showDialogError(r&&r.message||'Unable to save '+type.toLowerCase()+' usage.');return;}
      closeDialog();toast(r.message||'Usage saved.');loadShowUsage(type==='Product'?'products':'materials');
    }).withFailureHandler(function(x){
      setButtonLoading(b,false,'Save '+type+' Usage');showDialogError(x&&x.message||'Unable to save usage.');
    })[fn](state.token,payload);
  }

  function submitAssignEmployee(e){
    e.preventDefault();
    if(!activeShowId) return;

    const btn = document.getElementById('assignEmployeeBtn');
    setButtonLoading(btn,true,'Assigning...');

    // Safety timeout: never leave the dialog stuck on "Assigning...".
    clearTimeout(window.__assignEmployeeTimer);
    window.__assignEmployeeTimer = setTimeout(function(){
      if(btn && btn.disabled){
        setButtonLoading(btn,false,'Assign Employee');
        showDialogError('The server did not respond. Please try Assign Employee again.');
      }
    },30000);

    google.script.run
      .withSuccessHandler(function(r){
        clearTimeout(window.__assignEmployeeTimer);
        setButtonLoading(btn,false,'Assign Employee');
        if(!r || !r.ok){
          showDialogError(r && r.message || 'Unable to assign employee.');
          return;
        }
        closeDialog();
        toast(r.message || 'Employee assigned successfully.');

        // Immediately refresh the Client / Show Crew tab from the server
        // so the newly assigned employee appears without leaving the show.
        const crewTab = Array.from(document.querySelectorAll('.workspace-nav-btn'))
          .find(function(x){ return x.textContent.trim().toLowerCase() === 'crew'; });
        if(crewTab){
          document.querySelectorAll('.workspace-nav-btn').forEach(function(x){ x.classList.remove('active'); });
          crewTab.classList.add('active');
        }
        loadShowUsage('crew');

        if(typeof loadEmployees === 'function') loadEmployees();
      })
      .withFailureHandler(function(err){
        clearTimeout(window.__assignEmployeeTimer);
        setButtonLoading(btn,false,'Assign Employee');
        showDialogError(err && err.message || 'Unable to assign employee.');
      })
      .assignEmployeeToShow(state.token,{
        bookingId:activeShowId,
        employeeName:document.getElementById('crewEmployeeName').value,
        role:document.getElementById('crewEmployeeRole').value,
        employeeType:document.getElementById('crewEmployeeType').value,
        contact:document.getElementById('crewEmployeeContact').value,
        salary:document.getElementById('crewEmployeeSalary').value,
        bookingTotal:Number((window.currentShowBooking||{})['Final Amount'] || (window.currentShowBooking||{})['Total Amount Due'] || (window.currentShowBooking||{})['Total Amount'] || 0),
        showAssignment:document.getElementById('crewShowAssignment').value,
        notes:document.getElementById('crewEmployeeNotes').value
      });
  }

  function initCalendar(){
    const now = new Date();
    calendarState.year = now.getFullYear();
    calendarState.month = now.getMonth();
    calendarState.view = 'month';
    calendarState.filter = 'all';
    updateCalendarControls();
    loadCalendar();
  }

  function updateCalendarControls(){
    const map = {
      month: document.getElementById('calMonthBtn'),
      week: document.getElementById('calWeekBtn'),
      day: document.getElementById('calDayBtn')
    };
    Object.keys(map).forEach(function(k){
      if(map[k]) map[k].classList.toggle('active', calendarState.view === k);
    });
    const filters = {
      all: document.getElementById('calAllBtn'),
      booking: document.getElementById('calBookingsBtn'),
      payment: document.getElementById('calPaymentsBtn')
    };
    Object.keys(filters).forEach(function(k){
      if(filters[k]) filters[k].classList.toggle('active', calendarState.filter === k);
    });
  }

  function setCalendarView(view){
    calendarState.view=view;
    updateCalendarControls();
    renderCalendarBody();
  }

  function setCalendarFilter(filter){
    calendarState.filter=filter;
    updateCalendarControls();
    renderCalendarBody();
  }

  function calendarPrev(){
    if(calendarState.view==='day' || calendarState.view==='week'){
      const d = new Date(calendarState.year, calendarState.month, calendarState.view==='day'?1:1);
      if(calendarState.view==='day') d.setDate(d.getDate()-1);
      else d.setDate(d.getDate()-7);
      calendarState.year=d.getFullYear();
      calendarState.month=d.getMonth();
    }else{
      calendarState.month--;
      if(calendarState.month<0){calendarState.month=11;calendarState.year--;}
    }
    loadCalendar();
  }

  function calendarNext(){
    if(calendarState.view==='day' || calendarState.view==='week'){
      const d = new Date(calendarState.year, calendarState.month, 1);
      d.setDate(d.getDate()+(calendarState.view==='day'?1:7));
      calendarState.year=d.getFullYear();
      calendarState.month=d.getMonth();
    }else{
      calendarState.month++;
      if(calendarState.month>11){calendarState.month=0;calendarState.year++;}
    }
    loadCalendar();
  }

  function calendarToday(){
    const now=new Date();
    calendarState.year=now.getFullYear();
    calendarState.month=now.getMonth();
    loadCalendar();
  }

  function loadCalendar(){
    const body=document.getElementById('calendarBody');
    const title=document.getElementById('calendarTitle');
    if(!body)return;
    body.innerHTML='<div class="loading-card">Loading calendar...</div>';
    if(title){
      title.textContent=new Date(calendarState.year,calendarState.month,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'});
    }
    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){body.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load calendar.')+'</div>';return;}
      calendarState.events=r.events||[];
      renderCalendarBody();
    }).withFailureHandler(function(e){
      body.innerHTML='<div class="error-card">'+esc(e&&e.message||'Unable to load calendar.')+'</div>';
    }).getCalendarData(state.token,calendarState.year,calendarState.month);
  }

  function filteredCalendarEvents(){
    return (calendarState.events||[]).filter(function(e){
      return calendarState.filter==='all' || e.type===calendarState.filter;
    });
  }

  function renderCalendarBody(){
    const body=document.getElementById('calendarBody');
    if(!body)return;
    updateCalendarControls();
    const title=document.getElementById('calendarTitle');
    if(title){
      title.textContent=new Date(calendarState.year,calendarState.month,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'});
    }
    const events=filteredCalendarEvents();

    if(calendarState.view==='week'){
      body.innerHTML=renderCalendarWeek(events);
      return;
    }
    if(calendarState.view==='day'){
      body.innerHTML=renderCalendarDay(events);
      return;
    }

    const first=new Date(calendarState.year,calendarState.month,1);
    const startOffset=first.getDay();
    const daysInMonth=new Date(calendarState.year,calendarState.month+1,0).getDate();
    const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
    const cells=[];

    for(let i=0;i<totalCells;i++){
      const day=i-startOffset+1;
      if(day<1 || day>daysInMonth){
        cells.push('<div class="calendar-cell"></div>');
        continue;
      }
      const dateKey=String(calendarState.year)+'-'+String(calendarState.month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const dayEvents=events.filter(e=>e.date===dateKey);
      cells.push(`
        <div class="calendar-cell">
          <div class="calendar-day">${day}</div>
          ${dayEvents.map(function(e){
            const cls=e.type==='booking'?'gold-event':'';
            return `<button type="button" class="calendar-event ${cls}" onclick="openCalendarEvent('${esc(e.id)}')">${esc(e.title)}</button>`;
          }).join('')}
        </div>`);
    }

    body.innerHTML=`<div class="calendar-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return `<div class="calendar-head">${d}</div>`;}).join('')}
      ${cells.join('')}
    </div>`;
  }

  function renderCalendarWeek(events){
    const start=new Date(calendarState.year,calendarState.month,1);
    const sunday=new Date(start);
    sunday.setDate(start.getDate()-start.getDay());
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(sunday); d.setDate(sunday.getDate()+i);
      const key=d.toISOString().slice(0,10);
      const dayEvents=events.filter(e=>e.date===key);
      days.push(`<div class="calendar-cell" style="min-height:180px"><div class="calendar-day">${d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}</div>${dayEvents.map(e=>`<button type="button" class="calendar-event ${e.type==='booking'?'gold-event':''}" onclick="openCalendarEvent('${esc(e.id)}')">${esc(e.title)}</button>`).join('')}</div>`);
    }
    return `<div class="calendar-grid">${days.join('')}</div>`;
  }

  function renderCalendarDay(events){
    const d=new Date(calendarState.year,calendarState.month,1);
    const key=d.toISOString().slice(0,10);
    const dayEvents=events.filter(e=>e.date===key);
    return `<div class="panel"><div class="panel-head"><div><div class="panel-title">${esc(d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'}))}</div><div class="panel-subtitle">Scheduled events</div></div></div>${dayEvents.length?dayEvents.map(e=>`<button type="button" class="calendar-event ${e.type==='booking'?'gold-event':''}" style="display:block;width:100%;text-align:left;margin:8px 0" onclick="openCalendarEvent('${esc(e.id)}')"><strong>${esc(e.title)}</strong><br><span>${esc(e.client||e.details||'')}</span></button>`).join(''):'<div class="empty-state">No events for this day.</div>'}</div>`;
  }

  function loadEmployees(){

    google.script.run
      .withSuccessHandler(function(r){
        if(!r || !r.ok){

  function setEmployeeFilter(filter){
    employeeFilter = filter || 'All';
    ['All','Regular','On Call'].forEach(function(x){
      const id = 'employeeFilter' + x.replace(/\s/g,'');
      const el = document.getElementById(id);
      if(el) el.classList.toggle('active', x === employeeFilter);
    });
    renderEmployees();
  }

  function filterEmployees(){
    renderEmployees();
  }

  function renderEmployees(){
    const wrap = document.getElementById('employeesTableWrap');
    if(!wrap) return;

    const search = String((document.getElementById('employeeSearch') || {}).value || '').trim().toLowerCase();

    const rows = employeeRecords.filter(function(e){
      const type = String(e['Employee Type'] || 'Regular');
      const matchesFilter = employeeFilter === 'All' || type === employeeFilter;
      const haystack = [
        e['Employee Name'], e.Role, type, e['Contact Number'], e.Status
      ].join(' ').toLowerCase();
      return matchesFilter && (!search || haystack.indexOf(search) !== -1);
    });

    if(!employeeRecords.length){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-title">No employees yet.</div>
          <div class="empty-state-sub">Add your first Regular or On Call employee.</div>
        </div>`;
      return;
    }

    if(!rows.length){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-title">No matching employees.</div>
          <div class="empty-state-sub">Try another search or filter.</div>
        </div>`;
      return;
    }

    wrap.innerHTML = `
      <table class="data-table">
        <thead>
          <tr>
            <th>EMPLOYEE</th>
            <th>ROLE</th>
            <th>TYPE</th>
            <th>SHOWS THIS MONTH</th>
            <th>SHOW PAY THIS MONTH</th>
            <th>LOANS</th>
            <th>STATUS</th>
            <th>ACTION</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(function(e){
            const id = esc(e.ID || e.EmployeeID || '');
            const status = String(e.Status || 'Active');
            const type = String(e['Employee Type'] || 'Regular');
            return `
              <tr>
                <td><strong>${esc(e['Employee Name'] || '')}</strong></td>
                <td>${esc(e.Role || '')}</td>
                <td>${esc(type)}</td>
                <td>${esc(e.ShowsThisMonth || 0)}</td>
                <td>₱${Number(e.ShowPayThisMonth || 0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                <td>₱${Number(e.Loans || 0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                <td><span class="status-badge ${status === 'Active' ? 'status-paid' : 'status-pending'}">${esc(status)}</span></td>
                <td>
                  <div class="table-actions">
                    <button class="table-action" onclick="openEmployeeDialog('${id}')">Edit</button>
                    <button class="table-action" onclick="openEmployeeAdvanceDialog('${id}')">Advance/Loan</button>
                    <button class="table-action danger-text" onclick="deleteEmployeeUI('${id}')">Delete</button>
                  </div>
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function loadPayroll(){
    const panel=document.getElementById('payrollPanel');
    const period=document.getElementById('payrollPeriod')?.value || new Date().toISOString().slice(0,7);
    if(panel) panel.innerHTML='<div class="loading-card">Loading payroll...</div>';

    let finished=false;
    const timeoutId=setTimeout(function(){
      if(finished) return;
      if(panel) panel.innerHTML='<div class="error-card">Payroll is taking too long to load. Please refresh and try again.</div>';
    },15000);

    google.script.run
      .withSuccessHandler(function(r){
        finished=true; clearTimeout(timeoutId);
        if(!r||!r.ok){
          if(panel) panel.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load payroll.')+'</div>';
          return;
        }

        const summary=document.getElementById('payrollSummary');
        if(summary){
          summary.innerHTML=
            uiStat('Gross Show Pay',money(r.totals.gross))+
            uiStat('Advance / Loan Deductions',money(r.totals.deductions))+
            uiStat('Estimated Net Pay',money(r.totals.net))+
            uiStat('Employees',r.totals.employees);
        }

        if(!r.rows.length){
          panel.innerHTML='<div class="panel"><div class="empty-state">No payrollable employee earnings for this period.</div></div>';
          return;
        }

        panel.innerHTML=`
          <div class="panel">
            <div class="panel-head">
              <div>
                <div class="panel-title">Payroll for ${esc(period)}</div>
                <div class="panel-subtitle">${esc(r.totals.processed||0)} payroll record${(r.totals.processed||0)===1?'':'s'} processed.</div>
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Shows</th>
                    <th>Gross Pay</th>
                    <th>Advance / Loan</th>
                    <th>Deduction</th>
                    <th>Net Pay</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${r.rows.map(x=>{
                    const detail = (x['Show Breakdown']||[]).map(b=>
                      `<div class="detail-row"><span>${esc(formatDate(b.eventDate))} · ${esc(b.eventName)}</span><strong>${money(b.pay)}</strong></div>`
                    ).join('');
                    return `
                      <tr>
                        <td>
                          <strong>${esc(x['Employee Name'])}</strong>
                          <div class="muted">${esc(x.Role||'')} · ${esc(x['Employee Type']||'')}</div>
                          ${detail ? `<div class="payroll-show-detail">${detail}</div>` : ''}
                        </td>
                        <td>${esc(x.Shows)}</td>
                        <td>${money(x['Gross Pay'])}</td>
                        <td><span class="badge ${Number(x['Advance / Loan Outstanding']||0)>0?'danger-badge':''}">${money(x['Advance / Loan Outstanding'])}</span></td>
                        <td>${money(x['Suggested Deduction'])}</td>
                        <td><strong>${money(x['Net Pay'])}</strong></td>
                        <td><span class="badge">${esc(x.Status)}</span></td>
                        <td>
                          ${x.Processed
                            ? `<span class="muted">Processed</span>`
                            : x.Shows
                              ? `<button class="btn gold small" onclick="processPayrollUI('${esc(x.EmployeeID)}','${esc(period)}')">Process</button>`
                              : '—'}
                        </td>
                      </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
      })
      .withFailureHandler(function(e){
        finished=true; clearTimeout(timeoutId);
        if(panel) panel.innerHTML='<div class="error-card">'+esc(e&&e.message||'Unable to load payroll.')+'</div>';
      })
      .getPayrollSummary(state.token,period);
  }

  function processPayrollUI(employeeId, period){
    if(!employeeId || !period) return;
    if(!confirm('Process payroll for this employee for '+period+'? Any outstanding employee advance/loan deduction will be applied automatically.')) return;

    google.script.run
      .withSuccessHandler(function(r){
        if(!r||!r.ok){
          toast(r&&r.message||'Unable to process payroll.');
          return;
        }
        toast(r.message||'Payroll processed successfully.');
        loadPayroll();
        loadEmployees();
      })
      .withFailureHandler(function(e){
        toast(e&&e.message||'Unable to process payroll.');
      })
      .savePayroll(state.token,{
        employeeId:employeeId,
        payrollPeriod:period,
        paymentDate:new Date().toISOString().slice(0,10)
      });
  }

          return;
        }

        const totalValue=inventory.reduce((s,i)=>s+Number(i['Inventory Value']||0),0);
        const available=inventory.reduce((s,i)=>s+Number(i['Available Stock']||0),0);
        const low=inventory.filter(i=>{
          const current=Number(i['Available Stock']||0);
          const minimum=Number(i['Minimum Stock']||0);
          return current>0 && current<=minimum;
        }).length;
        const out=inventory.filter(i=>Number(i['Available Stock']||0)<=0).length;

        const stats=document.querySelector('.stat-strip');
        if(stats){
          stats.innerHTML=
            uiStat('Inventory Value',money(totalValue))+
            uiStat('Available',available)+
            uiStat('Low Stock',low)+
            uiStat('Out of Stock',out);
        }

        p.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr>
          <th>Product</th><th>Current</th><th>Reserved</th><th>Available</th>
          <th>Minimum</th><th>Purchase Cost</th><th>Value</th><th>Status</th>
        </tr></thead><tbody>
          ${inventory.map(i=>{
            const current=Number(i['Current Stock']||0);
            const available=Number(i['Available Stock']||0);
            const minimum=Number(i['Minimum Stock']||0);
            const status=available<=0?'Out of Stock':available<=minimum?'Low Stock':'In Stock';
            const cls=status==='Out of Stock'?'danger-badge':status==='Low Stock'?'':'badge';
            return `<tr>
              <td><strong>${esc(i['Product Name']||'')}</strong></td>
              <td>${esc(current)}</td>
              <td>${esc(i['Reserved Stock']||0)}</td>
              <td>${esc(available)}</td>
              <td>${esc(minimum)}</td>
              <td>${money(i['Purchase Cost'])}</td>
              <td>${money(i['Inventory Value'])}</td>
              <td><span class="badge ${cls}">${esc(status)}</span></td>
            </tr>`;
          }).join('')}
        </tbody></table></div>`;
      })
      .withFailureHandler(function(e){
        const p=document.getElementById(panelId);
        if(p)p.innerHTML='<div class="error-card">'+esc(e&&e.message||'Unable to load inventory.')+'</div>';
      })
      .getInventory(state.token);
  }

  function renderStockIn(){
    const content=document.getElementById('moduleContent');
    content.innerHTML=`<div class="section-head"><div><div class="section-title">Stock In</div><div class="section-subtitle">Receive inventory and calculate landed cost.</div></div></div>
    <div class="panel"><form onsubmit="submitStockIn(event)"><div class="form-grid"><label>Product<select id="stockInProduct" required><option>Loading...</option></select></label><label>Quantity<input id="stockInQty" type="number" min="0.01" step="0.01" required></label><label>Purchase Cost<input id="stockInCost" type="number" min="0" step="0.01" required></label><label>Shipping Cost<input id="stockInShipping" type="number" min="0" step="0.01" value="0"></label><label>Other Charges<input id="stockInOther" type="number" min="0" step="0.01" value="0"></label><label>Source<input id="stockInSource"></label><label>Invoice Number<input id="stockInInvoice"></label><label>Batch Number<input id="stockInBatch"></label><label>Storage Location<select id="stockInLocation"><option>Warehouse</option><option>Storage Room</option><option>Vehicle</option><option>Event Site</option></select></label></div><div class="dialog-actions"><span></span><button id="saveStockInBtn" class="btn gold" type="submit">Save Stock In</button></div></form></div>`;
    google.script.run.withSuccessHandler(function(r){document.getElementById('stockInProduct').innerHTML='<option value="">Select product</option>'+(r.products||[]).filter(p=>p.Status!=='Inactive').map(p=>`<option value="${esc(p.ID)}">${esc(p.Name)} — ${esc(p.Category)}</option>`).join('');}).withFailureHandler(function(){document.getElementById('stockInProduct').innerHTML='<option value="">Unable to load products</option>';}).getProducts(state.token);
  }

  function submitStockIn(e){
    e.preventDefault();const b=document.getElementById('saveStockInBtn');setButtonLoading(b,true,'Saving...');
    google.script.run.withSuccessHandler(function(r){setButtonLoading(b,false,'Save Stock In');if(!r||!r.ok){toast(r&&r.message||'Unable to save stock-in.');return;}toast(r.message);e.target.reset();}).withFailureHandler(function(x){setButtonLoading(b,false,'Save Stock In');toast(x&&x.message||'Unable to save stock-in.');}).saveStockIn(state.token,{productId:document.getElementById('stockInProduct').value,quantity:document.getElementById('stockInQty').value,purchaseCost:document.getElementById('stockInCost').value,shippingCost:document.getElementById('stockInShipping').value,otherCharges:document.getElementById('stockInOther').value,source:document.getElementById('stockInSource').value,invoiceNumber:document.getElementById('stockInInvoice').value,batchNumber:document.getElementById('stockInBatch').value,storageLocation:document.getElementById('stockInLocation').value});
  }

  function renderStockOut(){
    const content=document.getElementById('moduleContent');
    content.innerHTML=`<div class="section-head"><div><div class="section-title">Stock Out</div><div class="section-subtitle">Record stock usage with server-side negative-stock validation.</div></div></div>
    <div class="panel"><form onsubmit="submitStockOut(event)"><div class="form-grid"><label>Product<select id="stockOutProduct" required><option>Loading...</option></select></label><label>Quantity<input id="stockOutQty" type="number" min="0.01" step="0.01" required></label><label>Booking ID<input id="stockOutBooking"></label><label>Reason<input id="stockOutReason"></label><label>Batch Number<input id="stockOutBatch"></label><label>Storage Location<select id="stockOutLocation"><option>Warehouse</option><option>Storage Room</option><option>Vehicle</option><option>Event Site</option></select></label></div><div class="dialog-actions"><span></span><button id="saveStockOutBtn" class="btn gold" type="submit">Save Stock Out</button></div></form></div>`;
    google.script.run.withSuccessHandler(function(r){document.getElementById('stockOutProduct').innerHTML='<option value="">Select product</option>'+(r.inventory||[]).filter(i=>Number(i['Available Stock']||0)>0).map(i=>`<option value="${esc(i.ProductID)}">${esc(i['Product Name'])} — Available ${esc(i['Available Stock'])}</option>`).join('');}).withFailureHandler(function(){document.getElementById('stockOutProduct').innerHTML='<option value="">Unable to load inventory</option>';}).getInventory(state.token);
  }

  function submitStockOut(e){
    e.preventDefault();const b=document.getElementById('saveStockOutBtn');setButtonLoading(b,true,'Saving...');
    google.script.run.withSuccessHandler(function(r){setButtonLoading(b,false,'Save Stock Out');if(!r||!r.ok){toast(r&&r.message||'Unable to save stock-out.');return;}toast(r.message);e.target.reset();}).withFailureHandler(function(x){setButtonLoading(b,false,'Save Stock Out');toast(x&&x.message||'Unable to save stock-out.');}).saveStockOut(state.token,{productId:document.getElementById('stockOutProduct').value,quantity:document.getElementById('stockOutQty').value,bookingId:document.getElementById('stockOutBooking').value,reason:document.getElementById('stockOutReason').value,batchNumber:document.getElementById('stockOutBatch').value,storageLocation:document.getElementById('stockOutLocation').value});
  }




  function showDialog(inner){
    let modal=document.getElementById('globalDialog');
    if(!modal){modal=document.createElement('div');modal.id='globalDialog';modal.className='modal';document.body.appendChild(modal);}
    modal.innerHTML=inner;modal.classList.add('show');
  }
  function closeDialog(){const m=document.getElementById('globalDialog');if(m)m.classList.remove('show');}
  function showDialogError(message){
    let el=document.querySelector('#globalDialog .dialog-error');
    if(!el){const c=document.querySelector('#globalDialog .dialog-card');if(c){el=document.createElement('div');el.className='dialog-error';c.insertBefore(el,c.firstChild);}}
    if(el)el.textContent=message;
  }
  function toast(message){
    let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
    el.textContent=message;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
  }
  function setButtonLoading(btn,loading,text){
    if(!btn)return;
    if(loading){btn.disabled=true;btn.dataset.originalText=btn.textContent;btn.innerHTML='<span class="spinner small-spinner"></span>'+esc(text||'Saving...');}
    else{btn.disabled=false;btn.textContent=text||btn.dataset.originalText||'Save';}
  }


  function openBookingWorkspace(){
    renderShell('Clients');

    const content = document.getElementById('moduleContent');
    if (!content) return;

    // Use the existing booking renderer if this build already has one.
    if (typeof renderBookingModule === 'function') {
      renderBookingModule();
      return;
    }

    // If the current build uses another booking page function, call it here.
    if (typeof showBookings === 'function') {
      showBookings();
      return;
    }

    // Temporary message only if the booking renderer is not present in this build.
    content.innerHTML = `
      <div class="section-head">
        <div>
          <div class="section-title">Clients</div>
          <div class="section-subtitle">Client and booking workspace</div>
        </div>
      </div>
      <div class="panel">
        <div class="empty-state">
          Booking workspace function is not present in this build.
        </div>
      </div>
    `;
  }

  function logout(){
    const token = state.token;

    localStorage.removeItem('csf_phase1_token');
    state.token = '';
    state.user = null;

    if(
      typeof google !== 'undefined' &&
      google.script &&
      google.script.run
    ){
      google.script.run
        .withSuccessHandler(function(){
          renderLogin();
        })
        .withFailureHandler(function(){
          renderLogin();
        })
        .logout(token);
    }else{
      renderLogin();
    }
  }

  function start(){
    if(!state.token){
      renderLogin();
      return;
    }

    google.script.run
      .withSuccessHandler(function(result){
        if(result && result.ok){
          state.user = result.user;
          renderDashboard();
        }else{
          localStorage.removeItem('csf_phase1_token');
          state.token = '';
          renderLogin();
        }
      })
      .withFailureHandler(function(){
        localStorage.removeItem('csf_phase1_token');
        state.token = '';
        renderLogin();
      })
      .validateSession(state.token);
  }

  start();
</script>
