        ${history.length?`<div class="table-wrap"><table class="data-table">
          <thead><tr><th>Payment Date</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead>
          <tbody>${history.map(function(p){return `<tr>
            <td>${esc(formatDate(p.Date))}</td>
            <td>${money(p.Amount||0)}</td>
            <td>${esc(p.Method||'—')}</td>
            <td><span class="badge">${esc(p.Status||'Completed')}</span></td>
          </tr>`;}).join('')}</tbody>
        </table></div>`:'<div class="empty-state">No recorded payments for this loan yet.</div>'}
      </div>
      <div class="dialog-actions"><span></span><button type="button" class="btn" onclick="closeDialog()">Close</button></div>
    </div>`);
  }

  function confirmDeleteLoanModule(loanId){
    const l=cachedLoans.find(function(x){ return String(x.ID||x.LoanID||'')===String(loanId); });
    if(!l){toast('Loan not found.');return;}
    showDialog(`<div class="dialog-card">
      <div class="dialog-head"><div><div class="dialog-title">Delete Loan?</div><div class="dialog-subtitle">This cannot be undone.</div></div><button class="dialog-close" onclick="closeDialog()">×</button></div>
      <div class="void-warning">Deleting this loan will permanently remove it from the records, including its paid/outstanding history. Make sure this is intentional before continuing.</div>
      <div class="summary-table">
        <div><span>Borrowed From</span><strong>${esc(l.Lender||'—')}</strong></div>
        <div><span>Loan Amount</span><strong>${money(l['Loan Amount']||0)}</strong></div>
        <div><span>Loan %</span><strong>${pct(l['Loan Percentage'])}</strong></div>
        <div><span>Paid</span><strong>${money(l['Amount Paid']||0)}</strong></div>
        <div><span>Outstanding</span><strong>${money(l['Outstanding Balance']||0)}</strong></div>
      </div>
      <div class="dialog-actions"><span></span><button type="button" class="btn" onclick="closeDialog()">Cancel</button><button id="confirmDeleteLoanBtn" type="button" class="btn danger" onclick="executeDeleteLoanModule('${esc(l.ID||l.LoanID||'')}')">Yes, Delete Loan</button></div>
    </div>`);
  }

  function executeDeleteLoanModule(loanId){
    const btn=document.getElementById('confirmDeleteLoanBtn');
    setButtonLoading(btn,true,'Deleting...');
    google.script.run.withSuccessHandler(function(r){
      setButtonLoading(btn,false,'Yes, Delete Loan');
      if(!r||!r.ok){toast(r&&r.message||'Unable to delete loan.');return;}
      closeDialog();
      toast(r.message||'Loan deleted.');
      loadLoans();
    }).withFailureHandler(function(x){
      setButtonLoading(btn,false,'Yes, Delete Loan');
      toast(x&&x.message||'Unable to delete loan.');
    }).deleteLoan(state.token,loanId);
  }

  function openLoanForm(){
    showDialog(`
      <div class="dialog-card">
        <div class="dialog-head">
          <div>
            <div class="dialog-title">New Loan</div>
            <div class="dialog-subtitle">Record who the money came from and the amount borrowed.</div>
          </div>
          <button class="dialog-close" onclick="closeDialog()">×</button>
        </div>
        <form onsubmit="submitLoan(event)">
          <div class="form-grid">
            <label>Borrowed From<input id="loanLender" required placeholder="Person / company"></label>
            <label>Loan Amount<input id="loanAmount" type="number" min="0.01" step="0.01" required></label>
            <label>Loan Percentage<div class="input-suffix"><input id="loanPercentage" type="number" min="0" max="100" step="0.01" value="0" placeholder="0"><span>%</span></div></label>
            <label>Amount Already Paid<input id="loanAmountPaid" type="number" min="0" step="0.01" value="0"></label>
            <label>Date Borrowed<input id="loanDateBorrowed" type="date"></label>
            <label>Due Date<input id="loanDueDate" type="date"></label>
          </div>
          <label>Purpose<textarea id="loanPurpose" placeholder="What was the loan for?"></textarea></label>
          <label>Notes<textarea id="loanNotes"></textarea></label>
          <div class="dialog-actions">
            <span></span><button type="button" class="btn" onclick="closeDialog()">Cancel</button>
            <button id="saveLoanBtn" class="btn gold" type="submit">Save Loan</button>
          </div>
        </form>
      </div>
    `);
  }

  function submitLoan(e){
    e.preventDefault();
    const b=document.getElementById('saveLoanBtn');
    setButtonLoading(b,true,'Saving...');
    google.script.run.withSuccessHandler(function(r){
      setButtonLoading(b,false,'Save Loan');
      if(!r||!r.ok){showDialogError(r&&r.message||'Unable to save loan.');return;}
      closeDialog();toast(r.message);loadLoans();
    }).withFailureHandler(function(x){
      setButtonLoading(b,false,'Save Loan');showDialogError(x&&x.message||'Unable to save loan.');
    }).saveLoan(state.token,{
      lender:document.getElementById('loanLender').value,
      amount:document.getElementById('loanAmount').value,
      percentage:document.getElementById('loanPercentage').value,
      amountPaid:document.getElementById('loanAmountPaid').value,
      dateBorrowed:document.getElementById('loanDateBorrowed').value,
      dueDate:document.getElementById('loanDueDate').value,
      purpose:document.getElementById('loanPurpose').value,
      notes:document.getElementById('loanNotes').value
    });
  }

  function recordLoanPaymentUI(loan){
    if(Number(loan['Outstanding Balance']||0)<=0){
      toast('This loan is already fully paid.');
      return;
    }
    showDialog(`
      <div class="dialog-card">
        <div class="dialog-head">
          <div>
            <div class="dialog-title">Record Loan Payment</div>
            <div class="dialog-subtitle">${esc(loan.Lender)} · Outstanding ${money(loan['Outstanding Balance'])}</div>
          </div>
          <button class="dialog-close" onclick="closeDialog()">×</button>
        </div>
        <form onsubmit="submitLoanPayment(event,'${esc(loan.ID)}')">
          <div class="form-grid">
            <label>Payment Amount<input id="loanPaymentAmount" type="number" min="0.01" step="0.01" max="${esc(loan['Outstanding Balance'])}" required></label>
            <label>Payment Date<input id="loanPaymentDate" type="date" value="${new Date().toISOString().slice(0,10)}" disabled readonly></label>
            <label>Method<input id="loanPaymentMethod" placeholder="Cash / GCash / Bank"></label>
          </div>
          <div class="dialog-actions">
            <span></span><button type="button" class="btn" onclick="closeDialog()">Cancel</button>
            <button id="payLoanBtn" class="btn gold" type="submit">Record Payment</button>
          </div>
        </form>
      </div>
    `);
  }

  function submitLoanPayment(e, loanId){
    e.preventDefault();
    const b=document.getElementById('payLoanBtn');
    setButtonLoading(b,true,'Saving...');
    google.script.run.withSuccessHandler(function(r){
      setButtonLoading(b,false,'Record Payment');
      if(!r||!r.ok){showDialogError(r&&r.message||'Unable to record payment.');return;}
      closeDialog();toast(r.message);loadLoans();
    }).withFailureHandler(function(x){
      setButtonLoading(b,false,'Record Payment');showDialogError(x&&x.message||'Unable to record payment.');
    }).recordLoanPayment(state.token,{
      loanId:loanId,
      amount:document.getElementById('loanPaymentAmount').value,
      date:document.getElementById('loanPaymentDate').value,
      method:document.getElementById('loanPaymentMethod').value
    });
  }

  function renderInventory(){
    const content=document.getElementById('moduleContent');
    if(!content)return;

    const panelId='inventoryPanel';
    let panel=document.getElementById(panelId);
    if(!panel){
      content.innerHTML=uiInventory();
      panel=document.getElementById(panelId);
    }
    if(panel) panel.innerHTML='<div class="loading-card">Loading inventory...</div>';

    google.script.run
      .withSuccessHandler(function(r){
        const p=document.getElementById(panelId);
        if(!p)return;

        if(!r || !r.ok){
          p.innerHTML='<div class="error-card">'+esc(r&&r.message||'Unable to load inventory.')+'</div>';
          return;
        }

        const inventory=Array.isArray(r.inventory)?r.inventory:[];

        if(!inventory.length){
          p.innerHTML='<div class="workspace-empty">No inventory items yet.<br><span style="font-size:11px;color:#666">Add a product first and its inventory record will be created automatically.</span></div>';
          return;
        }

        const totalValue=inventory.reduce((s,i)=>s+Number(i['Inventory Value']||0),0);
        const available=inventory.reduce((s,i)=>s+Number(i['Available Stock']||0),0);
        const low=inventory.filter(i=>{
          const current=Number(i['Available Stock']||0);
          const minimum=Number(i['Minimum Stock']||0);
          return current>0 && current<=minimum;
        }).length;
        const out=inventory.filter(i=>Number(i['Available Stock']||0)<=0).length;

        const stats=document.querySelector('.stat-strip');
        if(stats){
          stats.innerHTML=
            uiStat('Inventory Value',money(totalValue))+
            uiStat('Available',available)+
            uiStat('Low Stock',low)+
            uiStat('Out of Stock',out);
        }

        p.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr>
          <th>Product</th><th>Current</th><th>Reserved</th><th>Available</th>
          <th>Minimum</th><th>Purchase Cost</th><th>Value</th><th>Status</th>
        </tr></thead><tbody>
          ${inventory.map(i=>{
            const current=Number(i['Current Stock']||0);
            const available=Number(i['Available Stock']||0);
            const minimum=Number(i['Minimum Stock']||0);
            const status=available<=0?'Out of Stock':available<=minimum?'Low Stock':'In Stock';
            const cls=status==='Out of Stock'?'danger-badge':status==='Low Stock'?'':'badge';
            return `<tr>
              <td><strong>${esc(i['Product Name']||'')}</strong></td>
              <td>${esc(current)}</td>
              <td>${esc(i['Reserved Stock']||0)}</td>
              <td>${esc(available)}</td>
              <td>${esc(minimum)}</td>
              <td>${money(i['Purchase Cost'])}</td>
              <td>${money(i['Inventory Value'])}</td>
              <td><span class="badge ${cls}">${esc(status)}</span></td>
            </tr>`;
          }).join('')}
        </tbody></table></div>`;
      })
      .withFailureHandler(function(e){
        const p=document.getElementById(panelId);
        if(p)p.innerHTML='<div class="error-card">'+esc(e&&e.message||'Unable to load inventory.')+'</div>';
      })
      .getInventory(state.token);
  }


  function showDialog(inner){
    let modal=document.getElementById('globalDialog');
    if(!modal){modal=document.createElement('div');modal.id='globalDialog';modal.className='modal';document.body.appendChild(modal);}
    modal.innerHTML=inner;modal.classList.add('show');
  }
  function closeDialog(){const m=document.getElementById('globalDialog');if(m)m.classList.remove('show');}
  function showDialogError(message){
    let el=document.querySelector('#globalDialog .dialog-error');
    if(!el){const c=document.querySelector('#globalDialog .dialog-card');if(c){el=document.createElement('div');el.className='dialog-error';c.insertBefore(el,c.firstChild);}}
    if(el)el.textContent=message;
  }
  function toast(message){
    let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
    el.textContent=message;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
  }
  function setButtonLoading(btn,loading,text){
    if(!btn)return;
    if(loading){btn.disabled=true;btn.dataset.originalText=btn.textContent;btn.innerHTML='<span class="spinner small-spinner"></span>'+esc(text||'Saving...');}
    else{btn.disabled=false;btn.textContent=text||btn.dataset.originalText||'Save';}
  }

  function logout(){
    const token = state.token;

    localStorage.removeItem('csf_phase1_token');
    state.token = '';
    state.user = null;

    if(
      typeof google !== 'undefined' &&
      google.script &&
      google.script.run
    ){
      google.script.run
        .withSuccessHandler(function(){
          renderLogin();
        })
        .withFailureHandler(function(){
          renderLogin();
        })
        .logout(token);
    }else{
      renderLogin();
    }
  }

  function start(){
    if(!state.token){
      renderLogin();
      return;
    }

    google.script.run
      .withSuccessHandler(function(result){
        if(result && result.ok){
          state.user = result.user;
          renderDashboard();
        }else{
          localStorage.removeItem('csf_phase1_token');
          state.token = '';
          renderLogin();
        }
      })
      .withFailureHandler(function(){
        localStorage.removeItem('csf_phase1_token');
        state.token = '';
        renderLogin();
      })
      .validateSession(state.token);
  }

  start();
</script>
